<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style><script src="../shared/config.js?v=1794900000"></script><script src="../shared/account.js?v=1794900000"></script>
<title>画像情報 杉浦先生ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one question "sheet" on graph-paper ground; red-pencil marks for answers, like the lecture print */
:root{
  --ground:#eef1f4; --grid:#dde3ea; --sheet:#ffffff; --ink:#18222f; --muted:#5d6876;
  --rule:#cfd6de; --red:#c8322a; --red-soft:#fbe9e7; --ok:#1d7a4e; --ok-soft:#e3f3ea;
  --chip:#e6ebf1; --focus:#2b6cb0;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#11161c; --grid:#1a222b; --sheet:#182029; --ink:#e7ecf1; --muted:#9aa6b3;
  --rule:#2c3743; --red:#ff7a6e; --red-soft:#3a1f1d; --ok:#5fd39b; --ok-soft:#173327;
  --chip:#232d38; --focus:#7fb2ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#11161c; --grid:#1a222b; --sheet:#182029; --ink:#e7ecf1; --muted:#9aa6b3;
  --rule:#2c3743; --red:#ff7a6e; --red-soft:#3a1f1d; --ok:#5fd39b; --ok-soft:#173327;
  --chip:#232d38; --focus:#7fb2ff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
.wrap{max-width:760px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:16px}
header h1{font-size:1.6rem;font-weight:900;margin:0;letter-spacing:.02em;text-wrap:balance}
header p{margin:2px 0 0;color:var(--muted);font-size:.85rem}
.panel{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lbl{font-size:.72rem;color:var(--muted);letter-spacing:.08em;min-width:3.5em}
.chip{font:inherit;font-size:.82rem;border:1px solid var(--rule);background:var(--chip);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.chip:focus-visible,.opt:focus-visible,.btn:focus-visible,.dot:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.stats{display:flex;gap:18px;font-size:.85rem;color:var(--muted)}
.stats b{font-family:var(--f-num);color:var(--ink);font-size:1.05rem}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:18px 18px 20px;display:flex;flex-direction:column;gap:14px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.78rem}
.no{font-family:var(--f-num);font-weight:700;font-size:1rem}
.tag{border:1px solid var(--rule);border-radius:4px;padding:1px 8px;color:var(--muted)}
.tag.k{border-color:var(--red);color:var(--red)}
.q{font-weight:700;font-size:1.02rem;margin:0}
figure{margin:0;background:#fff;border:1px solid var(--rule);border-radius:8px;padding:8px;overflow-x:auto}
figure img{display:block;margin:0 auto;max-width:100%;height:auto}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{font:inherit;text-align:left;display:flex;gap:12px;align-items:baseline;width:100%;padding:10px 14px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .n{font-family:var(--f-num);color:var(--muted);font-size:.85rem;min-width:1.2em}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .n{color:var(--ok)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .n{color:var(--red)}
.note{font-size:.75rem;color:var(--muted);margin:0}
.verdict{font-weight:900;font-size:1.15rem;margin:0}
.verdict.ok{color:var(--ok)} .verdict.ng{color:var(--red)}
.exp{border-top:2px solid var(--red);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.exp h3{margin:0;font-size:.8rem;letter-spacing:.12em;color:var(--red)}
.exp p,.exp ol{margin:0}
.exp ol{padding-left:1.4em;display:flex;flex-direction:column;gap:4px}
.exp b{color:var(--red);font-weight:700}
.exp .trap{background:var(--red-soft);border-radius:6px;padding:8px 10px;font-size:.9rem}
.nav{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.btn{font:inherit;font-weight:700;border:1px solid var(--ink);background:var(--sheet);color:var(--ink);border-radius:8px;padding:9px 18px;cursor:pointer}
.btn.primary{background:var(--ink);color:var(--sheet)}
.btn:disabled{opacity:.4;cursor:default}
.dots{display:flex;flex-wrap:wrap;gap:5px}
.dot{font:inherit;font-family:var(--f-num);font-size:.7rem;width:30px;height:26px;border:1px solid var(--rule);border-radius:5px;background:var(--sheet);color:var(--muted);cursor:pointer;padding:0}
.dot.cur{border-color:var(--ink);color:var(--ink);font-weight:700}
.dot.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.dot.ng{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.empty{text-align:center;color:var(--muted);padding:30px 0}
.foot{font-size:.75rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.exp{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
.exp h4{margin:6px 0 0;font-size:.78rem;letter-spacing:.1em;color:var(--muted)}
.exp ol.each li.ans::marker{color:var(--ok);font-weight:700}
.exp ol.each li.ans{color:var(--ink);font-weight:500}
.exp .tip{background:var(--chip);border-radius:6px;padding:8px 10px;font-size:.9rem}
.exp .fm{font-family:var(--f-num);background:var(--chip);border-radius:6px;padding:8px 10px;text-align:center;overflow-x:auto}
.tw{overflow-x:auto}
.tb{border-collapse:collapse;font-size:.85rem;width:100%}
.tb th,.tb td{border:1px solid var(--rule);padding:4px 8px;text-align:left;vertical-align:top}
.tb th{background:var(--chip)}
.mx{border-collapse:collapse;display:inline-table;vertical-align:middle;border-left:2px solid var(--ink);border-right:2px solid var(--ink);border-radius:4px}
.mx td{font-family:var(--f-num);font-size:.85rem;padding:1px 7px;text-align:right}
.mxk{font-family:var(--f-num);font-size:.85rem;margin-right:6px}
.opt.picked{border-color:var(--focus);box-shadow:inset 0 0 0 1px var(--focus)}
.ttl{font-weight:700}
.top{font-size:.85rem;color:var(--muted);text-decoration:none}.top:hover{color:var(--ink)}
</style>
</head><body>
<div class="wrap">
  <header>
    <a class="top" href="../">← トップへ</a>
    <h1>画像情報 杉浦先生ドリル</h1>
    <p>杉浦先生（医用画像情報学）の授業プリントの問題 128問。選ぶと正誤と、選択肢ごとの解説が出ます。「2つ選べ」は2つ選ぶと答え合わせします。</p>
  </header>

  <section class="panel" aria-label="出題の設定">
        <div class="row"><span class="lbl">範囲</span><span id="catRow" class="row"></span></div>
    <div class="row"><span class="lbl">順番</span>
      <button class="chip" id="shuffleBtn" aria-pressed="false">シャッフル</button>
      <button class="chip" id="wrongBtn" aria-pressed="false">間違えた問題だけ</button>
      <button class="chip" id="resetBtn">記録を消す</button>
    </div>
    <div class="stats"><span>出題 <b id="sTotal">0</b></span><span>解答 <b id="sDone">0</b></span><span>正解 <b id="sOk">0</b></span><span>正答率 <b id="sRate">–</b></span></div>
  </section>

  <main id="card" class="sheet" aria-live="polite"></main>

  <section class="panel" aria-label="問題一覧">
    <div class="dots" id="dots"></div>
  </section>
  <p class="foot">杉浦先生の授業プリント（画像情報）の問題をまとめたものです。プリントで選択肢や問題が図になっている2問（F03・G05）は、図の特徴を文章に置きかえています。記録はこの端末のブラウザに、ニックネームごとに保存されます（クラウド保存はまだです）。</p>
</div>

<script src="../shared/memo.js?v=1794990000"></script>
<script src="data.js?v=1794900000"></script>
<script>
(()=>{
const Q = window.QUIZ || [];
const CATS = [...new Set(Q.map(q=>q.cat))];
const store = {get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
               set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const KQS = window.KQ && KQ.session();
const SFX = KQS ? "@" + KQS.nick.toLowerCase() : "";
let res = store.get("sug-res"+SFX,{});           // id -> {pick, ok}
let st = Object.assign({cat:"all",shuffle:false,wrong:false,pos:0}, store.get("sug-st"+SFX,{}));
let order = [];

const $ = id=>document.getElementById(id);
const memo = KQMemo.mount($("card"));   // 手書きの計算メモ
function chips(row, items, key){
  row.innerHTML="";
  items.forEach(([val,label])=>{
    const b=document.createElement("button");b.className="chip";b.textContent=label;
    b.setAttribute("aria-pressed", String(st[key]===val));
    b.onclick=()=>{st[key]=val;st.pos=0;build()};row.appendChild(b);
  });
}
function seededShuffle(arr){ // stable per session
  const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a;
}
function build(){
  chips($("catRow"),[["all","すべて"],...CATS.map(c=>[c,c])],"cat");
  $("shuffleBtn").setAttribute("aria-pressed",String(st.shuffle));
  $("wrongBtn").setAttribute("aria-pressed",String(st.wrong));
  let list = Q.filter(q=>st.cat==="all"||q.cat===st.cat);
  if(st.wrong) list = list.filter(q=>res[q.id]&&!res[q.id].ok);
  order = st.shuffle? seededShuffle(list): list;
  if(st.pos>=order.length) st.pos=0;
  render();
}
function stats(){
  const ids=new Set(order.map(q=>q.id));
  const done=Object.entries(res).filter(([k])=>ids.has(k));
  const ok=done.filter(([,v])=>v.ok).length;
  $("sTotal").textContent=order.length;$("sDone").textContent=done.length;$("sOk").textContent=ok;
  $("sRate").textContent=done.length?Math.round(ok/done.length*100)+"%":"–";
}
function dots(){
  const d=$("dots");d.innerHTML="";
  order.forEach((q,i)=>{const b=document.createElement("button");b.className="dot";b.textContent=i+1;
    if(i===st.pos)b.classList.add("cur");
    if(res[q.id])b.classList.add(res[q.id].ok?"ok":"ng");
    b.setAttribute("aria-label",`${i+1}問目`);b.onclick=()=>{st.pos=i;render();window.scrollTo({top:$("card").offsetTop-12})};d.appendChild(b)});
}
function render(){
  store.set("sug-st"+SFX,st);stats();dots();
  const c=$("card");
  if(!order.length){c.innerHTML=`<p class="empty">${st.wrong?"間違えた問題はありません。":"条件に合う問題がありません。"}</p>`;return}
  const q=order[st.pos], r=res[q.id];
  memo.sync(q.id);
  const nums="12345";
  c.innerHTML=`
    <div class="meta"><span class="no">${st.pos+1} / ${order.length}</span>
      <span class="tag k">${q.id}</span><span class="tag">${q.cat}</span>
      ${q.a.length>1?`<span class="tag k">${q.a.length}つ選ぶ</span>`:""}${q.kai?`<span class="tag">図→文章</span>`:""}</div>
    <p class="ttl">${q.t}</p>
    <p class="q">${q.q}</p>
    <div class="opts">${q.o.map((t,i)=>`<button class="opt" data-i="${i}"><span class="n">${nums[i]}</span><span>${t}</span></button>`).join("")}</div>
    ${q.kai?`<p class="note">※プリントでは図で出る問題です。図の特徴を文章に置きかえています。</p>`:""}
    <div id="after"></div>
    <div class="nav"><button class="btn" id="prev">← 前へ</button><button class="btn primary" id="next">次へ →</button></div>`;
  let picks=[];
  c.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;
    if(q.a.length===1){answer(q,[i]);return}
    if(picks.includes(i)){picks=picks.filter(x=>x!==i);b.classList.remove("picked")}else{picks.push(i);b.classList.add("picked")}
    if(picks.length===q.a.length) answer(q,picks.slice());
  });
  $("prev").disabled=st.pos===0;$("next").disabled=st.pos===order.length-1;
  $("prev").onclick=()=>{st.pos--;render()};$("next").onclick=()=>{st.pos++;render();window.scrollTo({top:$("card").offsetTop-12})};
  if(r) show(q,Array.isArray(r.pick)?r.pick:[r.pick]);
}
const same=(p,a)=>p.length===a.length&&p.every(x=>a.includes(x));
function answer(q,p){
  res[q.id]={pick:p,ok:same(p,q.a)};
  store.set("sug-res"+SFX,res);show(q,p);stats();dots();
}
function show(q,pick){
  const c=$("card");
  c.querySelectorAll(".opt").forEach(b=>{const i=+b.dataset.i;b.disabled=true;
    b.classList.remove("picked");
    if(q.a.includes(i))b.classList.add("correct");else if(pick.includes(i))b.classList.add("wrong")});
  const ok=same(pick,q.a);
  $("after").innerHTML=`<p class="verdict ${ok?"ok":"ng"}">${ok?"正解":"不正解"}　正答は ${q.a.map(i=>"12345"[i]).join("・")}${q.a.length===1&&q.id!=="F01"?"（"+q.o[q.a[0]]+"）":""}</p>
    <div class="exp"><h3>解説</h3>${q.e}</div>`;
}
$("shuffleBtn").onclick=()=>{st.shuffle=!st.shuffle;st.pos=0;build()};
$("wrongBtn").onclick=()=>{st.wrong=!st.wrong;st.pos=0;build()};
let armed=false;
$("resetBtn").onclick=e=>{ if(!armed){armed=true;e.target.textContent="もう一度押すと消去";setTimeout(()=>{armed=false;e.target.textContent="記録を消す"},3000);return}
  res={};store.set("sug-res"+SFX,res);armed=false;e.target.textContent="記録を消しました";build()};
build();
})();
</script>

</body></html>
