<style>
/* Layout: 1枚のカードを中央に大きく。上に今日のキュー、下に採点ボタン、さらに下に分野ごとの習得度 */
:root{
  --bg:#eef1f3; --card:#ffffff; --ink:#17212a; --muted:#5f6d78; --line:#d3dbe0; --soft:#e4e9ec;
  --accent:#1d3c6e; --accent-ink:#ffffff;
  --lv1:#0f8a8a; --lv2:#c27a12; --lv3:#b83a3a;
  --again:#b83a3a; --hard:#c27a12; --good:#1f7a45; --easy:#1d5fa8;
  --f-display:"Zen Kaku Gothic Antique","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161b; --card:#19222a; --ink:#e7eef2; --muted:#9babb5; --line:#2b3943; --soft:#212d36;
  --accent:#8fb3ef; --accent-ink:#0e1a2a; --lv1:#4cc3c0; --lv2:#e3a447; --lv3:#ff8a7e;
  --again:#ff8a7e; --hard:#e3a447; --good:#5fcf8f; --easy:#7fb2ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161b; --card:#19222a; --ink:#e7eef2; --muted:#9babb5; --line:#2b3943; --soft:#212d36;
  --accent:#8fb3ef; --accent-ink:#0e1a2a; --lv1:#4cc3c0; --lv2:#e3a447; --lv3:#ff8a7e;
  --again:#ff8a7e; --hard:#e3a447; --good:#5fcf8f; --easy:#7fb2ff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:18px 48px;display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:6px 16px}
h1{font-family:var(--f-display);font-weight:900;font-size:1.55rem;margin:0}
.sub{color:var(--muted);font-size:.82rem}
.queue{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.queue div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}
.queue b{font-family:var(--f-mono);font-size:1.25rem;font-variant-numeric:tabular-nums}
.queue span{font-size:.72rem;color:var(--muted)}
@media (max-width:460px){.queue{grid-template-columns:repeat(2,1fr)}}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.85rem;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
select{font:inherit;font-size:.85rem;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);max-width:100%}
label.tg{display:flex;align-items:center;gap:6px;font-size:.85rem;cursor:pointer}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 20px 18px;min-height:260px;display:flex;flex-direction:column;gap:12px;border-top:6px solid var(--lvc,var(--accent))}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.75rem;color:var(--muted)}
.tag{padding:1px 8px;border-radius:4px;background:var(--soft);font-weight:700}
.tag.lv{background:var(--lvc);color:var(--card)}
.front{font-family:var(--f-display);font-weight:700;font-size:1.3rem;line-height:1.5;text-wrap:pretty;margin:0}
.ansin{display:flex;gap:8px}
.ansin input{flex:1;min-width:0;font:inherit;font-size:1rem;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.back{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.back .a{font-size:1.15rem;font-weight:700}
.back .n{font-size:.88rem;color:var(--muted)}
.mine{font-size:.85rem;padding:6px 10px;border-radius:8px;background:var(--soft)}
.btn{font:inherit;font-weight:700;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.g{font:inherit;font-weight:700;border-radius:10px;padding:10px 6px;cursor:pointer;border:2px solid;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:2px}
.g small{font-weight:400;font-size:.7rem;color:var(--muted);font-family:var(--f-mono)}
.g.again{border-color:var(--again);color:var(--again)}.g.hard{border-color:var(--hard);color:var(--hard)}
.g.good{border-color:var(--good);color:var(--good)}.g.easy{border-color:var(--easy);color:var(--easy)}
.chip:focus-visible,.btn:focus-visible,.g:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.keys{font-size:.72rem;color:var(--muted)}
.done{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center}
.done h2{font-family:var(--f-display);margin:0}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
summary{cursor:pointer;font-weight:700}
.bars{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.bar{display:grid;grid-template-columns:minmax(0,11em) minmax(0,1fr) 5.5em;gap:8px;align-items:center;font-size:.8rem}
.bar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:10px;background:var(--soft);border-radius:5px;overflow:hidden;display:flex}
.track i{display:block;height:100%}
.track .m{background:var(--good)}.track .l{background:var(--lv2);opacity:.75}
.bar .v{font-family:var(--f-mono);text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:460px){.bar{grid-template-columns:minmax(0,7em) minmax(0,1fr) 4.6em}}
.legend{display:flex;gap:12px;font-size:.72rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.foot{font-size:.75rem;color:var(--muted)}
.row2{display:flex;flex-wrap:wrap;gap:8px}
</style>

<script>
const CARDS = [{"sec": "1. 解剖① 骨格・関節・筋", "rank": "S", "lv": 1, "type": "basic", "front": "成人の骨の数は約何個？", "back": "約206個／新生児は約300個", "note": "成長とともに骨が癒合して減る。新生児の約300個と入れ替えてくるひっかけに注意。", "id": "3a79e643d6"}, {"sec": "1. 解剖① 骨格・関節・筋", "rank": "S", "lv": 1, "type": "cloze", "front": "脊椎は頸椎＿＿個・胸椎＿＿個・腰椎＿＿個。", "back": "7・12・5", "note": "朝7時・昼12時・夕5時のごはんで覚える。頸椎5・腰椎7の入れ替えが定番ひっかけ。", "id": "5462ca83d6"}, {"sec": "1. 解剖① 骨格・関節・筋", "rank": "S", "lv": 2, "type": "basic", "front": "歯突起をもつのは第何頸椎？名前は？", "back": "第2頸椎（軸椎）", "note": "環椎（C1）ではない。歯突起は開口位（口を開けた正面像）で撮影し、骨折の有無を見る。", "id": "0fded4e06e"}, {"sec": "1. 解剖① 骨格・関節・筋", "rank": "S", "lv": 2, "type": "diff", "front": "環椎と隆椎の違い（番号と特徴）は？", "back": "環椎＝C1で椎体がない／隆椎＝C7で棘突起を体表から触れる", "note": "歯突起をもつ軸椎（C2）も含めて、特別な頸椎3つをセットで覚える。", "id": "e317fc82df"}, {"sec": "1. 解剖① 骨格・関節・筋", "rank": "S", "lv": 1, "type": "reverse", "front": "蝶形骨にあり、下垂体が入るくぼみの名前は？", "back": "トルコ鞍", "note": "ひっかけで「篩骨」「後頭骨」にされる。大後頭孔（延髄が通る）は後頭骨。", "id": "b17577a2b9"}, {"sec": "1. 解剖① 骨格・関節・筋", "rank": "S", "lv": 1, "type": "cloze", "front": "手根骨は近位列が舟状・月状・三角・＿＿、遠位列が大菱形・小菱形・＿＿・有鉤。", "back": "豆状骨・有頭骨", "note": "「舟・月・三・豆、大・小・有・有」と親指側から唱える。", "id": "9a49073e48"}, {"sec": "1. 解剖① 骨格・関節・筋", "rank": "S", "lv": 1, "type": "basic", "front": "手根骨で骨折が最も多い骨は？", "back": "舟状骨／見逃しやすく壊死しやすい", "note": "初回X線で写らないことがあり、偽関節・無腐性壊死に注意。舟状骨は足根骨にもある。", "id": "ba40a7d0c5"}, {"sec": "1. 解剖① 骨格・関節・筋", "rank": "S", "lv": 2, "type": "diff", "front": "手根骨と足根骨の数の違いは？", "back": "手根骨8個／足根骨7個", "note": "数の入れ替えが定番ひっかけ。足根骨は楔状骨が3個（内側・中間・外側）ある。", "id": "b48c7e49f0"}, {"sec": "1. 解剖① 骨格・関節・筋", "rank": "S", "lv": 2, "type": "basic", "front": "月状骨・距骨・有鉤骨・豆状骨のうち手根骨でないのは？", "back": "距骨（足根骨）", "note": "距骨・踵骨は足根骨。足根骨で最大はかかとの踵骨。舟状骨は手にも足にもあるので選択肢に注意。", "id": "5a8013e960"}, {"sec": "1. 解剖① 骨格・関節・筋", "rank": "S", "lv": 1, "type": "basic", "front": "肩関節と股関節の関節の種類は？", "back": "球関節", "note": "肩関節は可動域最大で脱臼も最多。「肩＝蝶番関節」は誤り。", "id": "734b23ecf2"}, {"sec": "1. 解剖① 骨格・関節・筋", "rank": "S", "lv": 3, "type": "diff", "front": "車軸関節と鞍関節、それぞれの代表例は？", "back": "車軸＝橈尺関節・環軸関節／鞍＝母指CM関節", "note": "蝶番関節は肘（腕尺関節）・指節間関節、楕円関節は橈骨手根関節。", "id": "8cf03a97b7"}, {"sec": "1. 解剖① 骨格・関節・筋", "rank": "S", "lv": 2, "type": "basic", "front": "上顎骨・前頭骨・後頭骨・篩骨のうち含気骨でないのは？", "back": "後頭骨（副鼻腔をもたない）", "note": "含気骨は上顎骨・前頭骨・蝶形骨・篩骨。頭頂骨も含気骨ではない（扁平骨）。", "id": "d887b18459"}, {"sec": "1. 解剖① 骨格・関節・筋", "rank": "A", "lv": 2, "type": "basic", "front": "横隔膜の支配神経と、その髄節は？", "back": "横隔神経（C3〜5）", "note": "「迷走神経」にするひっかけが定番。「3・4・5で横隔膜が動く」と覚える。", "id": "48f40b75cb"}, {"sec": "1. 解剖① 骨格・関節・筋", "rank": "A", "lv": 2, "type": "diff", "front": "上腕二頭筋と上腕三頭筋の支配神経の違いは？", "back": "二頭筋＝筋皮神経／三頭筋＝橈骨神経", "note": "大腿四頭筋＝大腿神経、ハムストリング＝坐骨神経もセットで。", "id": "831b3b64f6"}, {"sec": "1. 解剖① 骨格・関節・筋", "rank": "A", "lv": 2, "type": "diff", "front": "猿手と鷲手、原因となる神経まひの違いは？", "back": "猿手＝正中神経／鷲手＝尺骨神経", "note": "下垂手＝橈骨神経、下垂足＝腓骨神経。下垂手と下垂足の入れ替えにも注意。", "id": "e7a309ce0e"}, {"sec": "1. 解剖① 骨格・関節・筋", "rank": "A", "lv": 3, "type": "cloze", "front": "胸骨角は第＿＿肋骨、ヤコビー線は第＿＿腰椎の高さが目安。", "back": "2・4", "note": "肩甲骨下角は第7胸椎あたり。胸骨角を「第1肋骨」にするひっかけに注意。", "id": "bc8ed7c6a6"}, {"sec": "1. 解剖① 骨格・関節・筋", "rank": "A", "lv": 3, "type": "diff", "front": "OMラインとドイツ水平線（FH）の違いは？", "back": "OM＝眼窩外側縁と外耳孔／FH＝眼窩下縁と外耳孔上縁", "note": "頭部CTの基準はOMライン。結ぶ点を入れ替えてくるひっかけが出る。", "id": "e5c36e0491"}, {"sec": "1. 解剖① 骨格・関節・筋", "rank": "A", "lv": 2, "type": "basic", "front": "回旋筋腱板で断裂が最も多い筋は？", "back": "棘上筋", "note": "腱板は棘上筋・棘下筋・小円筋・肩甲下筋。大円筋・三角筋は含まない。評価はMRI。", "id": "42192709da"}, {"sec": "1. 解剖① 骨格・関節・筋", "rank": "A", "lv": 1, "type": "basic", "front": "腰椎椎間板ヘルニアの好発部位は？", "back": "L4/5とL5/S1", "note": "可動性が大きく負担のかかる下位腰椎に多い。評価はMRI。「胸椎に多い」は誤り。", "id": "ae8d95c653"}, {"sec": "1. 解剖① 骨格・関節・筋", "rank": "B", "lv": 3, "type": "diff", "front": "冠状縫合とラムダ縫合、それぞれ結ぶ骨は？", "back": "冠状＝前頭骨と頭頂骨／ラムダ＝頭頂骨と後頭骨", "note": "矢状縫合は左右の頭頂骨の間。冠状は冠をかぶる前側、ラムダは後ろでλ字形と覚える。", "id": "57b0ba27c4"}, {"sec": "1. 解剖① 骨格・関節・筋", "rank": "B", "lv": 3, "type": "basic", "front": "大泉門が閉じる時期の目安は？", "back": "1歳半〜2歳ごろ", "note": "小泉門はもっと早く、生後数か月で閉じる。大泉門は前頭骨と左右頭頂骨の間にある。", "id": "b117556285"}, {"sec": "1. 解剖① 骨格・関節・筋", "rank": "B", "lv": 3, "type": "basic", "front": "成人で赤色骨髄が残るのは四肢の長骨と体幹の骨のどちら？", "back": "体幹の骨（椎体・胸骨・腸骨など）", "note": "四肢の長骨は成長とともに脂肪骨髄（黄色骨髄）に置きかわる。骨髄シンチやMRIの見え方に直結。", "id": "314ffe3d64"}, {"sec": "2. 解剖② 循環器", "rank": "S", "lv": 1, "type": "cloze", "front": "大静脈→右房→＿＿→肺動脈→肺→肺静脈→＿＿→左室→大動脈", "back": "右室・左房", "note": "右側は静脈血、左側は動脈血の通り道と考えると順番を間違えない。", "id": "d1b47858cc"}, {"sec": "2. 解剖② 循環器", "rank": "S", "lv": 2, "type": "diff", "front": "肺動脈と肺静脈、流れる血液の違いは？", "back": "肺動脈＝静脈血／肺静脈＝動脈血", "note": "名前は心臓から出るか入るかで決まり、酸素の量では決まらない。", "id": "bd8a340fa4"}, {"sec": "2. 解剖② 循環器", "rank": "S", "lv": 1, "type": "basic", "front": "心臓で壁が最も厚い部屋は？", "back": "左室", "note": "全身に血を送るため圧が最も高い。右室は肺へ送るだけなので壁は左室の約1/3と薄い。", "id": "c0cccc1c0a"}, {"sec": "2. 解剖② 循環器", "rank": "S", "lv": 1, "type": "basic", "front": "左房と左室の間にある弁は？", "back": "僧帽弁（二尖弁）", "note": "「三右衛門」＝三尖弁は右。僧侶の帽子は山が2つ＝二尖弁。", "id": "9d30e6c78f"}, {"sec": "2. 解剖② 循環器", "rank": "S", "lv": 2, "type": "basic", "front": "冠動脈が起始する部位は？", "back": "大動脈基部（大動脈弁のすぐ上）", "note": "大動脈弁のすぐ上のふくらみ（バルサルバ洞）から出る。「肺動脈から」「大動脈弓から」は誤り。", "id": "678ebd92fa"}, {"sec": "2. 解剖② 循環器", "rank": "S", "lv": 1, "type": "basic", "front": "左冠動脈が分かれる2本の枝は？", "back": "前下行枝（LAD）と回旋枝（LCX）", "note": "右冠動脈は分岐せず1本で数える。冠動脈は大きく3本と覚える。", "id": "af815c0eda"}, {"sec": "2. 解剖② 循環器", "rank": "S", "lv": 1, "type": "cloze", "front": "大動脈弓の枝は右から＿＿・左総頸動脈・左鎖骨下動脈。", "back": "腕頭動脈", "note": "右から「わ・そう・さ」＝腕頭・総頸・鎖骨下。腕頭動脈は右側にしかない。", "id": "fd5ecf5ccf"}, {"sec": "2. 解剖② 循環器", "rank": "S", "lv": 2, "type": "reverse", "front": "腕頭動脈が出ない側は左右どちら？", "back": "左（左総頸・左鎖骨下は大動脈弓から直接）", "note": "右総頸動脈と右鎖骨下動脈は腕頭動脈から分かれ、大動脈弓から直接は出ない。", "id": "90321cbb84"}, {"sec": "2. 解剖② 循環器", "rank": "S", "lv": 2, "type": "basic", "front": "腹部大動脈の臓側枝で最も頭側から出るのは？", "back": "腹腔動脈", "note": "順に腹腔動脈→上腸間膜動脈→腎動脈→下腸間膜動脈。腹腔とSMAの逆転がひっかけ。", "id": "f0f30936e9"}, {"sec": "2. 解剖② 循環器", "rank": "S", "lv": 3, "type": "basic", "front": "腹部大動脈が左右の総腸骨動脈に分かれる高さは？", "back": "第4腰椎あたり", "note": "ヤコビー線（腸骨稜の最高点を結ぶ線）とほぼ同じ高さ。", "id": "999b4ee326"}, {"sec": "2. 解剖② 循環器", "rank": "S", "lv": 2, "type": "diff", "front": "門脈と肝静脈の違いは？", "back": "門脈＝腸の血を肝臓へ入れる／肝静脈＝肝臓から下大静脈へ出す", "note": "門脈は上腸間膜静脈と脾静脈が膵臓の裏で合流してできる。", "id": "14f3a53dc4"}, {"sec": "2. 解剖② 循環器", "rank": "S", "lv": 3, "type": "basic", "front": "肝臓に流入する血液のうち門脈が占める割合は？", "back": "約7〜8割", "note": "残りの2〜3割が固有肝動脈。肝細胞癌は主に肝動脈から栄養される。", "id": "1860a4a9fe"}, {"sec": "2. 解剖② 循環器", "rank": "S", "lv": 1, "type": "basic", "front": "胎児循環で酸素を最も多く含む血管は？", "back": "臍静脈", "note": "胎盤から来る血が流れる。臍動脈は使い終わった血を胎盤へ戻す。", "id": "aaaf381f2e"}, {"sec": "2. 解剖② 循環器", "rank": "S", "lv": 2, "type": "diff", "front": "胎児の動脈管と静脈管の違いは？", "back": "動脈管＝肺動脈→大動脈／静脈管＝臍静脈→下大静脈", "note": "卵円孔は右房→左房の穴。3つの短絡をセットで覚える。", "id": "70ab67df84"}, {"sec": "2. 解剖② 循環器", "rank": "S", "lv": 3, "type": "cloze", "front": "臍帯には臍動脈が＿＿本、臍静脈が＿＿本ある。", "back": "2・1", "note": "酸素が多いのは本数の少ない臍静脈のほう。単一臍帯動脈（1本）は奇形合併に注意する所見。", "id": "573bbe9abf"}, {"sec": "2. 解剖② 循環器", "rank": "S", "lv": 1, "type": "basic", "front": "胸部正面X線で左第4弓を作るのは？", "back": "左室", "note": "左は上から「大・肺・耳・室」＝大動脈弓・肺動脈・左心耳・左室。", "id": "2e3089aec7"}, {"sec": "2. 解剖② 循環器", "rank": "S", "lv": 3, "type": "basic", "front": "胸部正面X線で右第2弓を作るのは？", "back": "右房", "note": "右室は正面像で輪郭を作らない。右第1弓は上大静脈。", "id": "18891a08b8"}, {"sec": "2. 解剖② 循環器", "rank": "S", "lv": 3, "type": "cloze", "front": "胸部正面X線で左第2弓＝＿＿、左第3弓＝＿＿。", "back": "肺動脈・左心耳（左房）", "note": "左第3弓の突出は左房拡大（僧帽弁狭窄など）を示す。", "id": "d0f9f95422"}, {"sec": "2. 解剖② 循環器", "rank": "A", "lv": 2, "type": "basic", "front": "下壁の心筋梗塞で多い責任冠動脈は？", "back": "右冠動脈", "note": "前壁・心尖・中隔前側＝前下行枝、側壁＝回旋枝。下壁を「前下行枝」にするひっかけ。", "id": "b249f33481"}, {"sec": "2. 解剖② 循環器", "rank": "A", "lv": 2, "type": "basic", "front": "胸管が注ぐ部位は？", "back": "左静脈角（左内頸静脈と左鎖骨下静脈の合流部）", "note": "下半身と左上半身のリンパが集まる。胸管は乳び槽から始まる。「右静脈角」は誤り。", "id": "9ae913bcb2"}, {"sec": "2. 解剖② 循環器", "rank": "A", "lv": 3, "type": "basic", "front": "造影CTで左腎静脈が挟まれる2本の血管は？", "back": "腹部大動脈と上腸間膜動脈", "note": "大動脈の前を横切って右の下大静脈へ向かう。圧迫されるとナットクラッカー現象。", "id": "1f9eeb3d02"}, {"sec": "2. 解剖② 循環器", "rank": "B", "lv": 3, "type": "basic", "front": "総頸動脈が内頸・外頸動脈に分かれる高さの目安は？", "back": "甲状軟骨上縁（第4頸椎あたり）", "note": "内頸動脈は脳へ、外頸動脈は顔へ。頸動脈分岐部はプラークの好発部位。", "id": "1cab16f23b"}, {"sec": "3. 解剖③ 呼吸器・消化器", "rank": "S", "lv": 1, "type": "basic", "front": "気管分岐部の高さは？", "back": "第4〜5胸椎", "note": "胸骨角（第2肋骨）の高さとほぼ一致する。大動脈弓の下縁もこのあたり。", "id": "b936c08123"}, {"sec": "3. 解剖③ 呼吸器・消化器", "rank": "S", "lv": 2, "type": "diff", "front": "右主気管支と左主気管支の違いは？", "back": "右が太く・短く・急（垂直に近い）", "note": "「左の方が太い」「右の方が長い」と逆にしてくる。右は3本の葉気管支に分かれる。", "id": "6962d8239f"}, {"sec": "3. 解剖③ 呼吸器・消化器", "rank": "S", "lv": 1, "type": "basic", "front": "誤嚥した異物が入りやすいのは左右どちらの主気管支？", "back": "右主気管支", "note": "「右は太・短・急、だから誤嚥も右」。誤嚥性肺炎も右下葉に多い。", "id": "a419ddff81"}, {"sec": "3. 解剖③ 呼吸器・消化器", "rank": "S", "lv": 1, "type": "cloze", "front": "肺葉は右が＿＿葉、左が＿＿葉。", "back": "3・2", "note": "右は上・中・下葉、左は上・下葉。左は中葉の代わりに上葉の舌区がある。", "id": "91c385fbc2"}, {"sec": "3. 解剖③ 呼吸器・消化器", "rank": "S", "lv": 2, "type": "reverse", "front": "左上葉にあり、右の中葉に相当する部分は？", "back": "舌区", "note": "左肺は心臓がある分小さい。「左に中葉がある」は誤り。", "id": "3cc8f71b75"}, {"sec": "3. 解剖③ 呼吸器・消化器", "rank": "S", "lv": 2, "type": "diff", "front": "立位で胸水と気胸の空気がたまる位置の違いは？", "back": "胸水＝下（CP角が鈍になる）／空気＝上（肺尖部）", "note": "液体は低い所、気体は高い所へ。臥位では胸水は背側に広がる。", "id": "1eb7ad032b"}, {"sec": "3. 解剖③ 呼吸器・消化器", "rank": "S", "lv": 1, "type": "basic", "front": "前縦隔に多い腫瘍は？", "back": "胸腺腫", "note": "「前は胸腺、真ん中リンパ、後ろは神経」。前縦隔の4T（胸腺腫・甲状腺・奇形腫・リンパ腫）も参考に。", "id": "5f2883defd"}, {"sec": "3. 解剖③ 呼吸器・消化器", "rank": "S", "lv": 2, "type": "reverse", "front": "神経原性腫瘍が多い縦隔の区分は？", "back": "後縦隔", "note": "後縦隔には食道・下行大動脈・神経がある。胸腺腫を後縦隔にするひっかけに注意。", "id": "643e11abc6"}, {"sec": "3. 解剖③ 呼吸器・消化器", "rank": "S", "lv": 3, "type": "basic", "front": "中縦隔のリンパ節から生じる代表的な腫瘍は？", "back": "悪性リンパ腫", "note": "中縦隔には心臓・気管・リンパ節がある。胸腺腫＝前、神経原性腫瘍＝後と対で覚える。", "id": "17a52ce86f"}, {"sec": "3. 解剖③ 呼吸器・消化器", "rank": "S", "lv": 1, "type": "cloze", "front": "十二指腸→＿＿→＿＿→盲腸の順に進む。", "back": "空腸・回腸", "note": "空腸と回腸の逆転がひっかけ。小腸＝十二指腸・空腸・回腸。", "id": "5bfa0f1887"}, {"sec": "3. 解剖③ 呼吸器・消化器", "rank": "S", "lv": 1, "type": "basic", "front": "Couinaud分類でS1にあたる部分は？", "back": "尾状葉", "note": "S2〜4＝左葉、S5〜8＝右葉。S1を「右葉」「外側区」にするひっかけ。", "id": "3ef0dda0d9"}, {"sec": "3. 解剖③ 呼吸器・消化器", "rank": "S", "lv": 3, "type": "cloze", "front": "肝区域は＿＿の枝で分け、＿＿が区域の境界を走る。", "back": "門脈・肝静脈", "note": "区域の中心を門脈、境界を肝静脈が走る。S1から正面視で時計回りにS8まで進む。", "id": "4b399209b8"}, {"sec": "3. 解剖③ 呼吸器・消化器", "rank": "S", "lv": 1, "type": "basic", "front": "総胆管と主膵管が開口する部位は？", "back": "十二指腸下行部のファーター乳頭", "note": "「胃」「空腸」にするひっかけ。膵頭部は十二指腸に囲まれる。", "id": "002c626417"}, {"sec": "3. 解剖③ 呼吸器・消化器", "rank": "S", "lv": 2, "type": "diff", "front": "上行結腸と横行結腸、腹膜との関係の違いは？", "back": "上行結腸＝腹膜後器官／横行結腸＝腹膜内器官", "note": "下行結腸は腹膜後、S状結腸は腹膜内。結腸は交互になると覚える。", "id": "5d25cd7cef"}, {"sec": "3. 解剖③ 呼吸器・消化器", "rank": "S", "lv": 3, "type": "basic", "front": "腎臓・副腎・S状結腸・下大静脈のうち腹膜内器官は？", "back": "S状結腸", "note": "腹膜後は十二指腸・膵・腎・副腎・尿管・上行/下行結腸・大動脈・下大静脈。", "id": "cc4c4a7776"}, {"sec": "3. 解剖③ 呼吸器・消化器", "rank": "A", "lv": 2, "type": "cloze", "front": "肺区域は一般に右が＿＿区域、左が＿＿区域。", "back": "10・8", "note": "左はS1+2、S7+8のようにまとめて数える。「左右同数」は誤り。", "id": "da21164d5f"}, {"sec": "3. 解剖③ 呼吸器・消化器", "rank": "A", "lv": 3, "type": "basic", "front": "仰臥位の人の誤嚥性肺炎が多いのは背側と腹側どちらの区域？", "back": "背側（S2・S6・S10）", "note": "重力で背側に流れ込む。立位なら下葉の底部（S10など）に多い。", "id": "84186ebb87"}, {"sec": "3. 解剖③ 呼吸器・消化器", "rank": "A", "lv": 3, "type": "basic", "front": "食道の生理的狭窄部3か所は？", "back": "食道入口部・気管分岐部（大動脈弓交差部）・横隔膜貫通部", "note": "異物がつかえやすく、がんもできやすい。噴門から先は含まない。", "id": "d1b6879849"}, {"sec": "3. 解剖③ 呼吸器・消化器", "rank": "A", "lv": 2, "type": "basic", "front": "立位で胃泡（空気）がたまる胃の部位は？", "back": "胃底部（穹窿部）", "note": "空気は一番高い所へ。立位では胃底部が最も高い。「胃泡は前庭部」は誤り。", "id": "e1d564b052"}, {"sec": "3. 解剖③ 呼吸器・消化器", "rank": "A", "lv": 2, "type": "diff", "front": "X線でのケルクリング襞とハウストラの違いは？", "back": "ケルクリング襞＝小腸で全周を横切る／ハウストラ＝大腸で途中までのくびれ", "note": "大腸には結腸ヒモもある。名前の入れ替えが定番ひっかけ。", "id": "221bc26b24"}, {"sec": "3. 解剖③ 呼吸器・消化器", "rank": "B", "lv": 3, "type": "diff", "front": "主膵管と副膵管、それぞれの開口部は？", "back": "主膵管＝ファーター乳頭／副膵管＝副乳頭", "note": "主膵管＝ウィルスング管（総胆管と合流）、副膵管＝サントリーニ管。副乳頭は主乳頭より口側。", "id": "20c16da94b"}, {"sec": "3. 解剖③ 呼吸器・消化器", "rank": "B", "lv": 3, "type": "basic", "front": "十二指腸と空腸の境を吊り下げる靱帯は？", "back": "トライツ靱帯", "note": "トライツ靱帯より口側の出血が上部消化管出血。十二指腸空腸曲を吊り下げている。", "id": "0ceb611abb"}, {"sec": "4. 解剖④ 泌尿器・生殖器・内分泌", "rank": "S", "lv": 1, "type": "basic", "front": "左右の腎臓で位置が低いのはどちら？", "back": "右腎", "note": "上に肝臓があるため、右腎は左腎より半椎体〜1椎体ほど低い。「右腎の方が高い」は誤り。", "id": "665a51e8cd"}, {"sec": "4. 解剖④ 泌尿器・生殖器・内分泌", "rank": "S", "lv": 3, "type": "basic", "front": "腎臓の高さの目安（椎体）は？", "back": "第12胸椎〜第3腰椎", "note": "腎臓は腹膜後器官。呼吸や体位で上下に動き、立位では下がる（目安）。", "id": "d8e628a19c"}, {"sec": "4. 解剖④ 泌尿器・生殖器・内分泌", "rank": "S", "lv": 2, "type": "cloze", "front": "腎門の並びは前から腎静脈・＿＿・尿管。", "back": "腎動脈", "note": "前から「V・A・U（Vein・Artery・Ureter）」。", "id": "9243389662"}, {"sec": "4. 解剖④ 泌尿器・生殖器・内分泌", "rank": "S", "lv": 2, "type": "basic", "front": "糸球体があるのは腎皮質と腎髄質のどちら？", "back": "皮質", "note": "「糸球体は髄質」は誤り。糸球体＋ボウマン嚢＝腎小体、＋尿細管＝ネフロン。", "id": "0ea00a0115"}, {"sec": "4. 解剖④ 泌尿器・生殖器・内分泌", "rank": "S", "lv": 1, "type": "cloze", "front": "近位尿細管→＿＿→遠位尿細管→集合管→腎杯→腎盂", "back": "ヘンレループ", "note": "糸球体でこされた原尿は尿細管で再吸収されながら進む。", "id": "e1eff449bb"}, {"sec": "4. 解剖④ 泌尿器・生殖器・内分泌", "rank": "S", "lv": 2, "type": "basic", "front": "尿管の生理的狭窄部3か所は？", "back": "腎盂尿管移行部・総腸骨動脈交差部・膀胱壁内（膀胱入口）", "note": "尿路結石がつまりやすい。「腎杯」「尿道」を混ぜるひっかけ。", "id": "936bb0ec5b"}, {"sec": "4. 解剖④ 泌尿器・生殖器・内分泌", "rank": "S", "lv": 1, "type": "basic", "front": "立位の女性で腹水が最もたまりやすい部位は？", "back": "ダグラス窩（直腸子宮窩）", "note": "立位で腹腔の一番低い所。子宮の前は膀胱、後ろは直腸。", "id": "c9cd4b93dd"}, {"sec": "4. 解剖④ 泌尿器・生殖器・内分泌", "rank": "S", "lv": 2, "type": "diff", "front": "ダグラス窩とモリソン窩の違いは？", "back": "ダグラス窩＝子宮と直腸の間（立位で最下点）／モリソン窩＝肝臓と右腎の間（仰臥位でたまる）", "note": "外傷のFASTではモリソン窩・脾周囲・ダグラス窩（膀胱直腸窩）を確認する。", "id": "4b46751c08"}, {"sec": "4. 解剖④ 泌尿器・生殖器・内分泌", "rank": "S", "lv": 3, "type": "basic", "front": "男性でダグラス窩に相当するくぼみは？", "back": "直腸膀胱窩", "note": "男性には子宮がないため直腸と膀胱の間が最下点になる。", "id": "807f8a2ed5"}, {"sec": "4. 解剖④ 泌尿器・生殖器・内分泌", "rank": "S", "lv": 1, "type": "basic", "front": "下垂体後葉から分泌されるホルモン2つは？", "back": "抗利尿ホルモン（ADH）とオキシトシン", "note": "「後ろは少数精鋭」。残りのGH・TSH・ACTH・PRL・FSH・LHは前葉。", "id": "cfeeb848d4"}, {"sec": "4. 解剖④ 泌尿器・生殖器・内分泌", "rank": "S", "lv": 1, "type": "basic", "front": "副甲状腺ホルモン（PTH）を分泌する臓器は？", "back": "副甲状腺（通常4個、甲状腺の裏）", "note": "「PTHは甲状腺から出る」は誤り。副甲状腺腺腫の検出には99mTc-MIBIシンチを使う。", "id": "d6b5fc2c66"}, {"sec": "4. 解剖④ 泌尿器・生殖器・内分泌", "rank": "S", "lv": 2, "type": "diff", "front": "PTHとカルシトニン、血中カルシウムへの作用の違いは？", "back": "PTH＝上げる（副甲状腺）／カルシトニン＝下げる（甲状腺）", "note": "出どころと作用の両方を入れ替えてくる。PTHは骨吸収と腎でのCa再吸収を促す。", "id": "045aeadd1e"}, {"sec": "4. 解剖④ 泌尿器・生殖器・内分泌", "rank": "S", "lv": 1, "type": "basic", "front": "甲状腺ホルモン合成のために甲状腺が取り込む元素は？", "back": "ヨウ素", "note": "甲状腺シンチや甲状腺癌のヨウ素治療はこの性質を利用する。", "id": "e2082394da"}, {"sec": "4. 解剖④ 泌尿器・生殖器・内分泌", "rank": "S", "lv": 2, "type": "diff", "front": "副腎皮質と副腎髄質のホルモンの違いは？", "back": "皮質＝コルチゾール・アルドステロン／髄質＝アドレナリン・ノルアドレナリン", "note": "アドレナリンを「皮質」にするひっかけ。髄質の褐色細胞腫はMIBGシンチで描出する。", "id": "73314c5154"}, {"sec": "4. 解剖④ 泌尿器・生殖器・内分泌", "rank": "S", "lv": 1, "type": "reverse", "front": "膵島のα細胞が分泌するホルモンは？", "back": "グルカゴン", "note": "β細胞＝インスリン（血糖を下げる）。αとβの入れ替えがひっかけ。", "id": "56151dc268"}, {"sec": "4. 解剖④ 泌尿器・生殖器・内分泌", "rank": "A", "lv": 3, "type": "reverse", "front": "アルドステロンを分泌する副腎皮質の層は？", "back": "球状帯（最外層）", "note": "外から「塩・糖・性」＝球状帯・束状帯・網状帯。束状帯はコルチゾール、網状帯はアンドロゲン。", "id": "0c73ac9d59"}, {"sec": "4. 解剖④ 泌尿器・生殖器・内分泌", "rank": "A", "lv": 3, "type": "cloze", "front": "腎動脈→葉間動脈→＿＿→小葉間動脈→輸入細動脈→糸球体", "back": "弓状動脈", "note": "糸球体から出るのは細静脈でなく輸出細動脈。毛細血管が動脈と動脈ではさまれる珍しい構造。", "id": "c17d82e913"}, {"sec": "4. 解剖④ 泌尿器・生殖器・内分泌", "rank": "A", "lv": 3, "type": "basic", "front": "腎臓に流れる血液は心拍出量の約何分の1？", "back": "約1/5", "note": "安静時の腎血流量は約1L/分（目安）で、心拍出量約5L/分の約1/5にあたる。", "id": "163253eaf9"}, {"sec": "4. 解剖④ 泌尿器・生殖器・内分泌", "rank": "A", "lv": 2, "type": "diff", "front": "前立腺がんと前立腺肥大症、好発部位の違いは？", "back": "がん＝辺縁域／肥大＝移行域", "note": "評価はMRI（辺縁域のがんはT2強調で低信号）。好発部位を逆にするひっかけが定番。", "id": "a706a08e03"}, {"sec": "4. 解剖④ 泌尿器・生殖器・内分泌", "rank": "A", "lv": 2, "type": "diff", "front": "エストロゲンとプロゲステロンの分泌元の違いは？", "back": "エストロゲン＝卵胞／プロゲステロン＝黄体", "note": "黄体は排卵の後にできる。出どころの入れ替えがひっかけ。", "id": "ca7223c915"}, {"sec": "4. 解剖④ 泌尿器・生殖器・内分泌", "rank": "A", "lv": 3, "type": "basic", "front": "女性の尿道の長さの目安は？", "back": "約4cm", "note": "短いため膀胱炎になりやすい。男性の尿道は約16〜20cm。", "id": "3cfe413303"}, {"sec": "4. 解剖④ 泌尿器・生殖器・内分泌", "rank": "B", "lv": 3, "type": "basic", "front": "メラトニンを分泌し、成人でよく石灰化する器官は？", "back": "松果体", "note": "大人ではよく石灰化し、頭部CTで正中の目印になる。偏位していれば占拠性病変を疑う。", "id": "0163df3594"}, {"sec": "5. 解剖⑤ 神経・感覚器", "rank": "S", "lv": 1, "type": "basic", "front": "一次運動野がある脳回は？", "back": "中心前回（前頭葉）", "note": "中心溝のすぐ前にある。中心溝をはさんで後ろの中心後回は体性感覚野（頭頂葉）。", "id": "4905aa0cc3"}, {"sec": "5. 解剖⑤ 神経・感覚器", "rank": "S", "lv": 2, "type": "diff", "front": "中心前回と中心後回の働きの違いは？", "back": "中心前回＝運動野（前頭葉）／中心後回＝体性感覚野（頭頂葉）", "note": "「前は動かす、後ろは感じる」。入れ替えが定番ひっかけ。", "id": "0d03f9a439"}, {"sec": "5. 解剖⑤ 神経・感覚器", "rank": "S", "lv": 2, "type": "diff", "front": "ブローカ野とウェルニッケ野の違いは？", "back": "ブローカ＝前頭葉・話す中枢／ウェルニッケ＝側頭葉・言葉を理解する中枢", "note": "障害で運動性失語（ブローカ）と感覚性失語（ウェルニッケ）になる。", "id": "22abce5dc3"}, {"sec": "5. 解剖⑤ 神経・感覚器", "rank": "S", "lv": 1, "type": "basic", "front": "視覚野がある大脳の葉は？", "back": "後頭葉", "note": "聴覚野は側頭葉。後頭葉は後大脳動脈が養うため、その梗塞で同名半盲が出る。", "id": "4747a7d8fb"}, {"sec": "5. 解剖⑤ 神経・感覚器", "rank": "S", "lv": 1, "type": "basic", "front": "呼吸と心臓の中枢がある部位は？", "back": "延髄", "note": "「呼吸中枢は小脳」は誤り。小脳は平衡と運動の調整。", "id": "589cfb71b6"}, {"sec": "5. 解剖⑤ 神経・感覚器", "rank": "S", "lv": 2, "type": "diff", "front": "三叉神経と顔面神経の働きの違いは？", "back": "三叉神経＝顔の皮膚の感覚／顔面神経＝表情筋の運動", "note": "役割の入れ替えが定番ひっかけ。三叉はV、顔面はVII。", "id": "03f237912e"}, {"sec": "5. 解剖⑤ 神経・感覚器", "rank": "S", "lv": 1, "type": "basic", "front": "第3脳室と第4脳室をつなぐのは？", "back": "中脳水道", "note": "モンロー孔は側脳室と第3脳室の間。中脳水道の狭窄で水頭症になる。", "id": "a4ee26a58e"}, {"sec": "5. 解剖⑤ 神経・感覚器", "rank": "S", "lv": 2, "type": "basic", "front": "Willis動脈輪の構成に含まれない動脈は？前交通・後交通・中大脳・後大脳から。", "back": "中大脳動脈", "note": "輪は前交通・前大脳・内頸・後交通・後大脳で作る。脳動脈瘤の好発部位。", "id": "ffe60f0b86"}, {"sec": "5. 解剖⑤ 神経・感覚器", "rank": "S", "lv": 3, "type": "basic", "front": "後大脳動脈が起始する動脈は？", "back": "脳底動脈", "note": "脳底動脈は左右の椎骨動脈（鎖骨下動脈の枝）が合流してできる。", "id": "ed12f2a9f8"}, {"sec": "5. 解剖⑤ 神経・感覚器", "rank": "S", "lv": 1, "type": "basic", "front": "くも膜下出血の原因で最も多いのは？", "back": "脳動脈瘤の破裂", "note": "動脈瘤はWillis動脈輪の分岐部にできやすい。CTで脳底槽などに高吸収の出血が広がる。", "id": "3cbeb8e89d"}, {"sec": "5. 解剖⑤ 神経・感覚器", "rank": "S", "lv": 1, "type": "cloze", "front": "髄膜は外から硬膜・＿＿・軟膜。", "back": "くも膜", "note": "「硬い→くもの巣→軟らかい」。くも膜下出血はくも膜と軟膜の間。", "id": "ae98b189c4"}, {"sec": "5. 解剖⑤ 神経・感覚器", "rank": "S", "lv": 2, "type": "diff", "front": "CTでの硬膜外血腫と硬膜下血腫の形の違いは？", "back": "硬膜外＝凸レンズ型／硬膜下＝三日月型", "note": "「外は凸、下は三日月」。硬膜外は縫合線を越えず、硬膜下は縫合線を越えて広がる。", "id": "1fdbc0f0c2"}, {"sec": "5. 解剖⑤ 神経・感覚器", "rank": "S", "lv": 3, "type": "diff", "front": "硬膜外血腫と硬膜下血腫、主な損傷血管の違いは？", "back": "硬膜外＝中硬膜動脈／硬膜下＝橋渡し静脈", "note": "硬膜外は側頭骨骨折に伴う動脈性、硬膜下は静脈性が多い。", "id": "9fe5849f33"}, {"sec": "5. 解剖⑤ 神経・感覚器", "rank": "S", "lv": 2, "type": "basic", "front": "成人の脊髄下端の高さは？", "back": "第1〜2腰椎", "note": "腰椎穿刺はそれより下（L3/4など）で行う。「脊髄は仙骨まで」は誤り。", "id": "cee4a305f1"}, {"sec": "5. 解剖⑤ 神経・感覚器", "rank": "S", "lv": 3, "type": "cloze", "front": "脊髄神経31対＝頸神経＿＿対・胸12・腰5・仙骨5・尾骨1。", "back": "8", "note": "頸椎は7個だが頸神経は8対。C8神経はC7とT1の間から出る。", "id": "7a841f416f"}, {"sec": "5. 解剖⑤ 神経・感覚器", "rank": "S", "lv": 1, "type": "basic", "front": "放射線被ばくで白内障を起こす眼の部位は？", "back": "水晶体", "note": "眼で最も放射線に弱く、被ばく管理の対象になる。「硝子体がレンズ」は誤り。", "id": "b9a011bea9"}, {"sec": "5. 解剖⑤ 神経・感覚器", "rank": "A", "lv": 3, "type": "reverse", "front": "滑車神経が支配する外眼筋は？", "back": "上斜筋", "note": "外側直筋＝外転神経、残りの外眼筋と瞳孔の収縮＝動眼神経。", "id": "fb37f9b642"}, {"sec": "5. 解剖⑤ 神経・感覚器", "rank": "A", "lv": 2, "type": "basic", "front": "中耳にあるのは耳小骨・蝸牛・半規管・前庭のどれ？", "back": "耳小骨（ツチ・キヌタ・アブミ）", "note": "蝸牛（聴覚）・前庭と半規管（平衡）は内耳。中耳と内耳は側頭骨錐体の中。", "id": "f8062ccac2"}, {"sec": "5. 解剖⑤ 神経・感覚器", "rank": "A", "lv": 2, "type": "basic", "front": "高血圧性脳出血の最多部位は？", "back": "被殻", "note": "次いで視床。被殻は大脳基底核、視床は間脳に属する。", "id": "c27d0a002b"}, {"sec": "5. 解剖⑤ 神経・感覚器", "rank": "A", "lv": 2, "type": "basic", "front": "錐体路が左右交叉する部位は？", "back": "延髄（錐体交叉）", "note": "だから右脳の障害で左半身がまひする。「中脳」「脊髄」にするひっかけ。", "id": "3774cd2e46"}, {"sec": "5. 解剖⑤ 神経・感覚器", "rank": "B", "lv": 3, "type": "basic", "front": "下垂体腫瘍が視神経交叉を圧迫したときの視野障害は？", "back": "両耳側半盲", "note": "視神経交叉では鼻側半分の線維だけが交叉するため、両目の外側（耳側）が見えなくなる。", "id": "b1584b9546"}, {"sec": "5. 解剖⑤ 神経・感覚器", "rank": "B", "lv": 3, "type": "cloze", "front": "上矢状静脈洞→静脈洞交会→横静脈洞→＿＿→内頸静脈", "back": "S状静脈洞", "note": "静脈洞血栓症の評価ではMRVやCT venographyで流れを追う。", "id": "2f4dc20667"}, {"sec": "6. 生理学", "rank": "S", "lv": 1, "type": "basic", "front": "血液中の血漿と血球の容積の割合（目安）は？", "back": "血漿 約55%、血球 約45%", "note": "血球の大部分は赤血球。この赤血球の割合がヘマトクリット。", "id": "f0d56ba4fb"}, {"sec": "6. 生理学", "rank": "S", "lv": 2, "type": "diff", "front": "ヘマトクリットが表すのは血漿の割合か、赤血球の割合か？", "back": "赤血球の割合／男 約45%、女 約40%", "note": "「血漿の割合」とするひっかけに注意。血漿は約55%。", "id": "76a689d64a"}, {"sec": "6. 生理学", "rank": "S", "lv": 3, "type": "basic", "front": "白血球数と血小板数の基準値の目安は（/μL）？", "back": "白血球 約4000〜9000、血小板 約15万〜35万", "note": "赤血球は男 約500万・女 約450万。桁の違いで覚える（千・十万・百万）。", "id": "f788625d37"}, {"sec": "6. 生理学", "rank": "S", "lv": 1, "type": "basic", "front": "赤血球の寿命は約何日？", "back": "約120日", "note": "血小板は約7〜10日、好中球は数日以内。古い赤血球は主に脾臓で壊される。", "id": "101c01fa66"}, {"sec": "6. 生理学", "rank": "S", "lv": 2, "type": "diff", "front": "赤血球が作られる場所と、主に壊される場所は？", "back": "作る＝骨髄、壊す＝脾臓", "note": "「赤血球は脾臓で作られる」は誤り（成人の造血は骨髄）。", "id": "306a562278"}, {"sec": "6. 生理学", "rank": "S", "lv": 2, "type": "basic", "front": "成熟した状態で核をもたない血球を2つ挙げよ。", "back": "赤血球と血小板", "note": "白血球（好中球・リンパ球など）は核をもつ。", "id": "805cafbd03"}, {"sec": "6. 生理学", "rank": "S", "lv": 2, "type": "diff", "front": "血清と血漿の違いは？", "back": "血清＝血漿から凝固因子（フィブリノゲンなど）を除いたもの", "note": "採血後に固まらせた上澄みが血清。抗凝固剤入りで遠心した上澄みが血漿。", "id": "aa6fa6ae4c"}, {"sec": "6. 生理学", "rank": "S", "lv": 3, "type": "cloze", "front": "血液凝固の最後に、フィブリノゲンが＿＿（網）に変わり固まる。", "back": "フィブリン", "note": "凝固にはカルシウムとビタミンKが必要。血小板の凝集が最初の段階。", "id": "e3b99b2b04"}, {"sec": "6. 生理学", "rank": "S", "lv": 1, "type": "cloze", "front": "肺活量＝予備吸気量＋＿＿＋予備呼気量。", "back": "1回換気量（約500 mL）", "note": "全肺気量＝肺活量＋残気量。", "id": "0ee56b321f"}, {"sec": "6. 生理学", "rank": "S", "lv": 2, "type": "basic", "front": "スパイロメータで測定できない肺気量分画は？", "back": "残気量／残気量を含む全肺気量・機能的残気量も直接は測れない", "note": "残気量は吐ききっても肺に残る空気で、肺活量に含まれない。", "id": "3d2c7b982d"}, {"sec": "6. 生理学", "rank": "S", "lv": 1, "type": "basic", "front": "心電図のP波は何を表す？", "back": "心房の興奮（脱分極）", "note": "「Pは部屋の前（心房）、QRSは本番（心室）、Tは後片付け」。", "id": "62e5855a78"}, {"sec": "6. 生理学", "rank": "S", "lv": 2, "type": "reverse", "front": "心室の再分極（興奮がさめる過程）を表す心電図の波は？", "back": "T波", "note": "T波を「心房の再分極」とするひっかけに注意。QRS波は心室の脱分極。", "id": "f499c0157a"}, {"sec": "6. 生理学", "rank": "S", "lv": 3, "type": "basic", "front": "心房の再分極が心電図で見えない理由は？", "back": "同時に起こるQRS波に隠れるため", "note": "心房の興奮＝P波、心房の再分極は見えない、が正しい組合せ。", "id": "ec1b6e2aca"}, {"sec": "6. 生理学", "rank": "S", "lv": 1, "type": "basic", "front": "1日に作られる原尿量と、最終的な尿量の目安は？", "back": "原尿 約150 L、尿 約1.5 L", "note": "原尿の約99%が再吸収される。GFRは約100 mL/分。", "id": "e8f0b4baba"}, {"sec": "6. 生理学", "rank": "S", "lv": 2, "type": "basic", "front": "クレアチニンがGFRの指標になる理由は？", "back": "糸球体でろ過されたあと、ほとんど再吸収されないため", "note": "eGFRは血清クレアチニン・年齢・性別から計算する。", "id": "dd259dcc39"}, {"sec": "6. 生理学", "rank": "S", "lv": 3, "type": "diff", "front": "腎機能低下時、ヨード造影剤とGd造影剤で特に注意する副作用は？", "back": "ヨード＝造影剤腎症、ガドリニウム＝腎性全身性線維症（NSF）", "note": "どちらも投与前にeGFRを確認。eGFR 30未満は特にハイリスク（基準は施設による）。", "id": "96fee62991"}, {"sec": "6. 生理学", "rank": "S", "lv": 2, "type": "reverse", "front": "回腸末端で吸収される代表的な2つは？", "back": "ビタミンB12と胆汁酸", "note": "鉄・カルシウムは十二指腸〜空腸上部。大腸は主に水と電解質。", "id": "60f1804d71"}, {"sec": "6. 生理学", "rank": "S", "lv": 2, "type": "diff", "front": "胆汁を作る臓器と、濃縮する臓器は？", "back": "作る＝肝臓、濃縮＝胆嚢", "note": "胆汁は消化酵素を含まず、脂肪を乳化する。「胆嚢で作る」は誤り。", "id": "416f0a87ae"}, {"sec": "6. 生理学", "rank": "A", "lv": 1, "type": "cloze", "front": "成人の体重の約60%が水で、細胞内液 約＿＿%、細胞外液 約20%。", "back": "40", "note": "「ロク・ヨン・ニ」。新生児は約80%、高齢者は約50%。", "id": "f90e86d209"}, {"sec": "6. 生理学", "rank": "A", "lv": 2, "type": "diff", "front": "細胞内液と細胞外液で多い陽イオンはそれぞれ何？", "back": "細胞内＝カリウム（K）、細胞外＝ナトリウム（Na）", "note": "Na-Kポンプが Naを外へ、Kを中へ運んでこの差を保つ。逆にするひっかけ多い。", "id": "84b6888129"}, {"sec": "6. 生理学", "rank": "A", "lv": 2, "type": "basic", "front": "放射線被ばくで最も早く減少する血球は？", "back": "リンパ球", "note": "白血球で最多は好中球（約50〜70%）だが、放射線感受性が最も高いのはリンパ球。", "id": "39fabdccbc"}, {"sec": "6. 生理学", "rank": "A", "lv": 2, "type": "basic", "front": "酸素解離曲線を右方移動させる条件を3つ挙げよ。", "back": "CO2増加・体温上昇・pH低下", "note": "右方移動＝ヘモグロビンが酸素を離しやすい（組織に渡しやすい）。", "id": "bdfeddca21"}, {"sec": "6. 生理学", "rank": "A", "lv": 1, "type": "basic", "front": "刺激伝導系でペースメーカーとなるのはどこ？", "back": "洞房結節", "note": "洞房結節→房室結節→ヒス束→左右の脚→プルキンエ線維。房室結節とするひっかけ。", "id": "5953043556"}, {"sec": "6. 生理学", "rank": "B", "lv": 3, "type": "basic", "front": "呼吸中枢がある部位は？", "back": "延髄", "note": "血中CO2の増加を化学受容器が感じ、呼吸を増やす。体温中枢（視床下部）と区別。", "id": "d32031daca"}, {"sec": "6. 生理学", "rank": "B", "lv": 3, "type": "diff", "front": "胃の壁細胞と主細胞が分泌するものの違いは？", "back": "壁細胞＝塩酸と内因子、主細胞＝ペプシノゲン", "note": "内因子はビタミンB12の吸収に必要。胃切除後にB12欠乏性貧血が起こる理由。", "id": "b5102f8faa"}, {"sec": "6. 生理学", "rank": "B", "lv": 3, "type": "diff", "front": "アルドステロンとADHが作用する尿細管の部位と、再吸収するものは？", "back": "アルドステロン＝遠位尿細管でNa、ADH＝集合管で水", "note": "ブドウ糖は近位尿細管でほぼ全部再吸収される。", "id": "921ee8fb86"}, {"sec": "6-2. ホルモン（内分泌）", "rank": "S", "lv": 1, "type": "basic", "front": "下垂体前葉から分泌されるホルモン6つは？", "back": "GH・TSH・ACTH・PRL・FSH・LH", "note": "前葉は6つ、後葉は2つ（ADH・オキシトシン）。", "id": "38dbeea0da"}, {"sec": "6-2. ホルモン（内分泌）", "rank": "S", "lv": 2, "type": "diff", "front": "ADH・オキシトシンを作る場所と、分泌する場所は？", "back": "作る＝視床下部、分泌＝下垂体後葉", "note": "「後葉で作る」は誤り。後葉はためて出すだけ。", "id": "14b8bae40d"}, {"sec": "6-2. ホルモン（内分泌）", "rank": "S", "lv": 1, "type": "basic", "front": "ADHの作用部位と作用は？", "back": "腎の集合管で水を再吸収し、尿量を減らす", "note": "ADHが足りないと尿崩症（薄い尿が大量に出る）。", "id": "1f5b442148"}, {"sec": "6-2. ホルモン（内分泌）", "rank": "S", "lv": 2, "type": "reverse", "front": "血中Caを下げるホルモンと、その分泌臓器は？", "back": "カルシトニン／甲状腺（傍濾胞細胞）", "note": "「PTHはプラス、カルシトニンはカット」。PTHは副甲状腺。", "id": "b453d9ee9a"}, {"sec": "6-2. ホルモン（内分泌）", "rank": "S", "lv": 3, "type": "basic", "front": "PTHが血中Caを上げる3つのしくみは？", "back": "骨からCaを溶出・腎でCa再吸収・ビタミンD活性化で腸の吸収↑", "note": "PTHは甲状腺からは出ない。副甲状腺腺腫で高Ca血症。", "id": "9289c7f908"}, {"sec": "6-2. ホルモン（内分泌）", "rank": "S", "lv": 1, "type": "basic", "front": "甲状腺ホルモン（T3・T4）の材料となる元素は？", "back": "ヨウ素", "note": "この性質がI-123シンチ・I-131治療とヨード制限につながる。", "id": "b7d35fa11e"}, {"sec": "6-2. ホルモン（内分泌）", "rank": "S", "lv": 2, "type": "basic", "front": "甲状腺シンチグラフィに用いる放射性医薬品2つは？", "back": "I-123（ヨウ化ナトリウム）とTc-99m過テクネチウム酸", "note": "どちらも甲状腺の取り込みを見る。治療に使うのはI-131。", "id": "17dc97e1d7"}, {"sec": "6-2. ホルモン（内分泌）", "rank": "S", "lv": 2, "type": "basic", "front": "I-123シンチやI-131治療の前に行う食事上の準備は？", "back": "ヨード制限（海藻・ヨード入りうがい薬などを控える）", "note": "ヨード造影剤の後も甲状腺の取り込みが下がるので注意。", "id": "46c581d36d"}, {"sec": "6-2. ホルモン（内分泌）", "rank": "S", "lv": 1, "type": "reverse", "front": "副甲状腺腺腫の局在診断に使う放射性医薬品は？", "back": "Tc-99m MIBI", "note": "MDPは骨シンチ、MIBGは褐色細胞腫・心臓交感神経。", "id": "50e602da6e"}, {"sec": "6-2. ホルモン（内分泌）", "rank": "S", "lv": 2, "type": "basic", "front": "アルドステロンのNaとKに対する作用は？", "back": "Naと水を再吸収し、Kを排泄する（血圧↑）", "note": "「Kを戻す」は誤り。副腎皮質の球状帯（最外層）から出る。", "id": "a6405ad2ad"}, {"sec": "6-2. ホルモン（内分泌）", "rank": "S", "lv": 2, "type": "basic", "front": "I-123 MIBGシンチで検出する代表的な腫瘍2つは？", "back": "褐色細胞腫と神経芽腫", "note": "どちらも副腎髄質・交感神経系由来。「褐色にMIBG」。", "id": "f99428c6b8"}, {"sec": "6-2. ホルモン（内分泌）", "rank": "S", "lv": 3, "type": "basic", "front": "MIBGは腫瘍以外に、何の評価に使われる？", "back": "心臓の交感神経機能（MIBG心筋シンチ）", "note": "レビー小体型認知症やパーキンソン病で心臓への集積が低下する。", "id": "b45bb471a1"}, {"sec": "6-2. ホルモン（内分泌）", "rank": "S", "lv": 1, "type": "basic", "front": "血糖を下げる唯一のホルモンは？", "back": "インスリン（膵島β細胞）", "note": "上げる仲間はグルカゴン・コルチゾール・アドレナリン・GHなど多数。", "id": "0b21e7051e"}, {"sec": "6-2. ホルモン（内分泌）", "rank": "S", "lv": 2, "type": "diff", "front": "膵島のα細胞とβ細胞が分泌するホルモンは？", "back": "α＝グルカゴン（血糖↑）、β＝インスリン（血糖↓）", "note": "αとβの入れ替えに注意。δ細胞はソマトスタチン。", "id": "01e00fe9bf"}, {"sec": "6-2. ホルモン（内分泌）", "rank": "S", "lv": 1, "type": "diff", "front": "バセドウ病と橋本病、甲状腺機能が亢進するのはどちら？", "back": "バセドウ病（TSH受容体への自己抗体）", "note": "橋本病は慢性甲状腺炎で機能低下（むくみ・寒がり）。", "id": "ad71b7a09a"}, {"sec": "6-2. ホルモン（内分泌）", "rank": "A", "lv": 3, "type": "diff", "front": "バセドウ病と橋本病で、血中TSHはそれぞれ高い？低い？", "back": "バセドウ病＝低い、橋本病＝高い", "note": "負のフィードバック：T3・T4が多いとTSHが下がる。逆にしない。", "id": "65b51c4ecd"}, {"sec": "6-2. ホルモン（内分泌）", "rank": "A", "lv": 2, "type": "basic", "front": "レニンを分泌する細胞はどこにある？", "back": "腎臓の傍糸球体細胞", "note": "「副腎から出る」は誤り。レニン→アンジオテンシンⅡ→アルドステロン。", "id": "3936c6a05a"}, {"sec": "6-2. ホルモン（内分泌）", "rank": "A", "lv": 3, "type": "basic", "front": "ANPを分泌する部位と、血圧への作用は？", "back": "心房／Naを排泄させ血圧を下げる", "note": "レニン・アンジオテンシン・アルドステロン系と逆向きに働く。", "id": "089961c35e"}, {"sec": "6-2. ホルモン（内分泌）", "rank": "A", "lv": 2, "type": "diff", "front": "皮膚の色素沈着がみられるのはクッシング症候群とアジソン病のどちら？", "back": "アジソン病", "note": "アジソン病＝副腎皮質機能低下（低血圧・低血糖）。クッシング＝満月様顔貌・中心性肥満。", "id": "8f5692dde8"}, {"sec": "6-2. ホルモン（内分泌）", "rank": "A", "lv": 2, "type": "basic", "front": "原発性アルドステロン症でみられる血圧と血清Kの異常は？", "back": "高血圧と低K血症", "note": "「高K」は誤り。アルドステロンはKを捨てる。", "id": "1d6ca131d9"}, {"sec": "6-2. ホルモン（内分泌）", "rank": "A", "lv": 2, "type": "basic", "front": "尿崩症の原因ホルモンと、尿の特徴は？", "back": "ADHの不足／薄い尿が大量に出る（尿糖はない）", "note": "糖尿病とは別の病気。名前の「尿」でひっかけない。", "id": "b4b72100c0"}, {"sec": "6-2. ホルモン（内分泌）", "rank": "A", "lv": 3, "type": "basic", "front": "大きな下垂体腺腫で生じる典型的な視野障害は？", "back": "両耳側半盲", "note": "真上の視神経交叉を圧迫するため。腺腫は造影ダイナミックMRIの薄いスライスで探す。", "id": "f4eb1cb216"}, {"sec": "6-2. ホルモン（内分泌）", "rank": "A", "lv": 3, "type": "basic", "front": "ヨード造影剤との併用で乳酸アシドーシスに注意する糖尿病薬は？", "back": "ビグアナイド系（メトホルミンなど）", "note": "休薬の要否や期間は施設の基準に従う。", "id": "e74d45074e"}, {"sec": "6-2. ホルモン（内分泌）", "rank": "A", "lv": 3, "type": "diff", "front": "胆嚢を収縮させるのはセクレチンとCCKのどちら？", "back": "CCK（コレシストキニン）", "note": "セクレチン＝重炭酸の多い膵液を出させ胃酸を抑える。どちらも十二指腸から。", "id": "85cf12feb0"}, {"sec": "6-2. ホルモン（内分泌）", "rank": "B", "lv": 3, "type": "basic", "front": "I-131内用療法の対象となる代表的な疾患2つは？", "back": "バセドウ病と甲状腺分化癌", "note": "治療前はヨード制限で甲状腺の取り込みを高めておく。", "id": "d190827a19"}, {"sec": "7. 病理学総論", "rank": "S", "lv": 1, "type": "basic", "front": "炎症のケルススの4徴は？", "back": "発赤・熱感・腫脹・疼痛", "note": "「4徴」に機能障害は入らない。「蒼白」「冷感」は誤り。", "id": "2529a1fc33"}, {"sec": "7. 病理学総論", "rank": "S", "lv": 1, "type": "cloze", "front": "炎症の5徴候＝ケルススの4徴＋＿＿。", "back": "機能障害", "note": "5徴は発赤・熱感・腫脹・疼痛・機能障害。", "id": "d0733f0daa"}, {"sec": "7. 病理学総論", "rank": "S", "lv": 1, "type": "diff", "front": "良性腫瘍と悪性腫瘍の発育形式の違いは？", "back": "良性＝膨張性発育、悪性＝浸潤性発育", "note": "良性は被膜あり・境界明瞭・転移しない。悪性は境界不明瞭・転移する。", "id": "470855a2e6"}, {"sec": "7. 病理学総論", "rank": "S", "lv": 1, "type": "diff", "front": "癌腫と肉腫の由来の違いは？", "back": "癌腫＝上皮性、肉腫＝非上皮性（骨・筋・脂肪など）", "note": "「上皮は癌、中身は肉」。尿路上皮癌・腎細胞癌も上皮由来。", "id": "140f8cae3a"}, {"sec": "7. 病理学総論", "rank": "S", "lv": 2, "type": "diff", "front": "癌腫と肉腫で多い転移経路はそれぞれ？", "back": "癌腫＝リンパ行性、肉腫＝血行性", "note": "肉腫は若年者にも多く、肺転移しやすい。", "id": "6768a5f29a"}, {"sec": "7. 病理学総論", "rank": "S", "lv": 2, "type": "basic", "front": "ウィルヒョウ転移が起こるリンパ節は（左右も）？", "back": "左鎖骨上窩リンパ節", "note": "胃癌などで起こる。「右鎖骨上窩」は誤り。", "id": "8c64aada15"}, {"sec": "7. 病理学総論", "rank": "S", "lv": 3, "type": "reverse", "front": "ダグラス窩への播種性転移の名称は？", "back": "シュニッツラー転移", "note": "卵巣への転移はクルーケンベルグ腫瘍。名前と部位の対応で問われる。", "id": "00404de3cb"}, {"sec": "7. 病理学総論", "rank": "S", "lv": 1, "type": "basic", "front": "TNM分類のT・N・Mはそれぞれ何を表す？", "back": "T＝原発巣の大きさ・広がり、N＝リンパ節転移、M＝遠隔転移", "note": "Nを「腫瘍の数」とするひっかけ。M1は多くの癌でステージIV。", "id": "557eabdd78"}, {"sec": "7. 病理学総論", "rank": "S", "lv": 2, "type": "diff", "front": "塞栓と梗塞の違いは？", "back": "塞栓＝流れてきた血栓などが先で詰まること、梗塞＝血流途絶で組織が壊死すること", "note": "血栓＝血管内で血液が固まったもの。塞栓の結果として梗塞が起こる。", "id": "30d2973686"}, {"sec": "7. 病理学総論", "rank": "S", "lv": 2, "type": "diff", "front": "左心不全と右心不全でうっ血が起こる主な部位は？", "back": "左心不全＝肺うっ血、右心不全＝肝うっ血・下腿浮腫", "note": "「左は肺、右は肝と足」：詰まった心臓の一つ手前に血がたまる。", "id": "c7eae8ee53"}, {"sec": "7. 病理学総論", "rank": "S", "lv": 2, "type": "basic", "front": "肺塞栓症の造影CT所見と、代表的な塞栓源は？", "back": "肺動脈内の造影欠損／下肢の深部静脈血栓", "note": "深部静脈血栓が遊離して右心を経て肺動脈に詰まる。", "id": "342cbd56f6"}, {"sec": "7. 病理学総論", "rank": "S", "lv": 2, "type": "diff", "front": "壊死とアポトーシスで、炎症を伴うのはどちら？", "back": "壊死", "note": "壊死＝細胞が膨らんで破れる。アポトーシス＝細胞が縮み核が断片化、炎症なし。", "id": "cde3bcc050"}, {"sec": "7. 病理学総論", "rank": "S", "lv": 3, "type": "diff", "front": "心筋梗塞と脳梗塞の壊死の型はそれぞれ？", "back": "心筋梗塞＝凝固壊死、脳梗塞＝融解壊死", "note": "脳は脂質が多く溶けやすいため融解壊死になる。", "id": "18af119141"}, {"sec": "7. 病理学総論", "rank": "S", "lv": 1, "type": "basic", "front": "Ⅰ型アレルギーに関わる抗体と細胞は？", "back": "IgEと肥満細胞（ヒスタミン放出）", "note": "アナフィラキシー・花粉症・気管支喘息。T細胞はⅣ型、免疫複合体はⅢ型。", "id": "9e8c9deb0a"}, {"sec": "7. 病理学総論", "rank": "S", "lv": 1, "type": "basic", "front": "不適合輸血は何型アレルギー？", "back": "Ⅱ型（細胞傷害型）", "note": "自己免疫性溶血性貧血もⅡ型。「即・細・複・遅」。", "id": "4638ed13d7"}, {"sec": "7. 病理学総論", "rank": "S", "lv": 2, "type": "reverse", "front": "ツベルクリン反応・接触皮膚炎・移植片拒絶は何型アレルギー？", "back": "Ⅳ型（遅延型）", "note": "Ⅳ型だけ抗体ではなくT細胞が主役。", "id": "35f180a6e2"}, {"sec": "7. 病理学総論", "rank": "S", "lv": 3, "type": "basic", "front": "ヨード造影剤投与後、数時間〜数日で出る遅発性発疹に近いアレルギー型は？", "back": "Ⅳ型", "note": "即時性副作用（じんましん・血圧低下・呼吸困難）はⅠ型と同じ症状（アナフィラキシー様）。", "id": "275487c084"}, {"sec": "7. 病理学総論", "rank": "A", "lv": 2, "type": "diff", "front": "急性炎症と慢性炎症の主体となる細胞は？", "back": "急性＝好中球、慢性＝リンパ球・形質細胞・マクロファージ", "note": "肉芽腫（類上皮細胞・巨細胞のかたまり）は結核・サルコイドーシス。", "id": "6afedb1895"}, {"sec": "7. 病理学総論", "rank": "A", "lv": 3, "type": "basic", "front": "結核の肉芽腫に特徴的な壊死の名前は？", "back": "乾酪壊死", "note": "チーズのような見た目の壊死。サルコイドーシスの肉芽腫は乾酪壊死を伴わない。", "id": "d096155811"}, {"sec": "7. 病理学総論", "rank": "A", "lv": 2, "type": "diff", "front": "肥大と過形成の違いは？", "back": "肥大＝細胞が大きくなる、過形成＝細胞の数が増える", "note": "化生＝別の成熟組織に置き換わる（喫煙による気管支の扁平上皮化生、バレット食道）。", "id": "996d7308ad"}, {"sec": "7. 病理学総論", "rank": "A", "lv": 3, "type": "basic", "front": "低アルブミン血症で浮腫を起こす代表疾患2つは？", "back": "肝硬変とネフローゼ症候群", "note": "肝硬変は作れない、ネフローゼは尿に漏れる。アルブミン「増加」で浮腫は起きない。", "id": "8160eccde9"}, {"sec": "7. 病理学総論", "rank": "A", "lv": 2, "type": "reverse", "front": "AFP・PIVKA-IIが上昇する代表的な癌は？", "back": "肝細胞癌", "note": "CEA＝大腸癌など、CA19-9＝膵癌、PSA＝前立腺癌、CA125＝卵巣癌。", "id": "0813c50ec0"}, {"sec": "7. 病理学総論", "rank": "A", "lv": 2, "type": "basic", "front": "上皮内癌とは、癌細胞が何を越えていない状態？", "back": "基底膜", "note": "理論上転移しない。「上皮内癌は転移しやすい」は誤り。", "id": "4ddafca21c"}, {"sec": "7. 病理学総論", "rank": "B", "lv": 3, "type": "basic", "front": "胎盤を通過する唯一の免疫グロブリンは？", "back": "IgG", "note": "IgGは血中で最も多い。新生児の受動免疫を担う。", "id": "28b2b5d03f"}, {"sec": "7. 病理学総論", "rank": "B", "lv": 3, "type": "diff", "front": "IgMとIgAの特徴の違いは？", "back": "IgM＝感染で最初に出る・5量体（最大）、IgA＝粘膜・母乳に多い", "note": "IgEはⅠ型アレルギー、IgGは最多で胎盤通過。", "id": "9577f951ab"}, {"sec": "7. 病理学総論", "rank": "B", "lv": 3, "type": "diff", "front": "異栄養性石灰化と転移性石灰化の違いは？", "back": "異栄養性＝壊死組織に起こる（結核痕・動脈硬化）、転移性＝高Ca血症で起こる", "note": "どちらもCTで高吸収（白く写る）。", "id": "6e6e619d79"}, {"sec": "7-2. 細胞・組織・遺伝", "rank": "S", "lv": 1, "type": "basic", "front": "ATPを産生する細胞小器官は？", "back": "ミトコンドリア", "note": "「細胞の発電所」。リボソームとするひっかけに注意。", "id": "8991696b83"}, {"sec": "7-2. 細胞・組織・遺伝", "rank": "S", "lv": 2, "type": "diff", "front": "リボソームとリソソームの働きの違いは？", "back": "リボソーム＝タンパク質合成、リソソーム＝不要物の分解", "note": "「タンパク質工場」と「ゴミ処理場」。名前が似ていて入れ替えが頻出。", "id": "15b7591580"}, {"sec": "7-2. 細胞・組織・遺伝", "rank": "S", "lv": 1, "type": "diff", "front": "DNAにあってRNAにない塩基と、RNAだけにある塩基は？", "back": "DNAだけ＝チミン（T）、RNAだけ＝ウラシル（U）", "note": "DNAは2本鎖・デオキシリボース、RNAは1本鎖・リボース。", "id": "5ed2a2f8ea"}, {"sec": "7-2. 細胞・組織・遺伝", "rank": "S", "lv": 2, "type": "diff", "front": "転写と翻訳が行われる場所の違いは？", "back": "転写（DNA→mRNA）＝核内、翻訳（mRNA→タンパク質）＝リボソーム", "note": "翻訳の場所を「核」とするひっかけ。", "id": "91a2d2dfca"}, {"sec": "7-2. 細胞・組織・遺伝", "rank": "S", "lv": 1, "type": "cloze", "front": "細胞周期：G1期 →＿＿期（DNA複製）→ G2期 → M期。", "back": "S", "note": "DNAを複製するのはM期ではなくS期。", "id": "987d4a0cb3"}, {"sec": "7-2. 細胞・組織・遺伝", "rank": "S", "lv": 2, "type": "basic", "front": "細胞周期で放射線感受性が最も高い時期と最も低い時期は？", "back": "最も高い＝M期、最も低い＝S期後半", "note": "放射線生物学とセットで出る。", "id": "f2fd9c7e3b"}, {"sec": "7-2. 細胞・組織・遺伝", "rank": "S", "lv": 1, "type": "basic", "front": "ヒトの体細胞の染色体46本の内訳は？", "back": "常染色体22対（44本）＋性染色体2本", "note": "「常染色体が23対」は誤り。精子・卵子は23本。", "id": "c7a4eae423"}, {"sec": "7-2. 細胞・組織・遺伝", "rank": "S", "lv": 1, "type": "basic", "front": "腎盂・尿管・膀胱をおおう上皮は？", "back": "移行上皮（尿路上皮）", "note": "尿がたまると伸びて形が変わる上皮。膀胱を「重層扁平」とするひっかけ。", "id": "ac370350df"}, {"sec": "7-2. 細胞・組織・遺伝", "rank": "S", "lv": 2, "type": "basic", "front": "食道の上皮の種類と、食道癌で多い組織型は？", "back": "重層扁平上皮／扁平上皮癌", "note": "胃・大腸は単層円柱上皮なので腺癌が多い。", "id": "6b6dfd727e"}, {"sec": "7-2. 細胞・組織・遺伝", "rank": "S", "lv": 3, "type": "reverse", "front": "単層立方上皮でおおわれる代表的な部位2つは？", "back": "甲状腺の濾胞と尿細管", "note": "単層扁平＝血管内皮・肺胞、多列線毛＝鼻腔・気管・気管支。", "id": "b0c48896cc"}, {"sec": "7-2. 細胞・組織・遺伝", "rank": "S", "lv": 2, "type": "basic", "front": "X連鎖劣性遺伝の代表疾患2つは？", "back": "血友病とデュシェンヌ型筋ジストロフィー", "note": "Xが1本の男性に発症しやすい。女性は多くが保因者。「常染色体」とするひっかけ。", "id": "bd787f40b7"}, {"sec": "7-2. 細胞・組織・遺伝", "rank": "S", "lv": 3, "type": "basic", "front": "フェニルケトン尿症とウィルソン病の遺伝形式は？", "back": "常染色体劣性遺伝", "note": "常染色体優性はハンチントン病・マルファン症候群・家族性大腸腺腫症。", "id": "af42dc08ff"}, {"sec": "7-2. 細胞・組織・遺伝", "rank": "S", "lv": 1, "type": "basic", "front": "ダウン症候群の染色体異常は？", "back": "21トリソミー（計47本）", "note": "母体年齢が高いほど増え、先天性心疾患を伴いやすい。「18トリソミー」は誤り。", "id": "ad29bb77e3"}, {"sec": "7-2. 細胞・組織・遺伝", "rank": "S", "lv": 2, "type": "diff", "front": "ターナー症候群とクラインフェルター症候群の核型と性別は？", "back": "ターナー＝45,Xの女性（低身長）、クラインフェルター＝47,XXYの男性（高身長・不妊）", "note": "ターナー症候群を「男性」とするひっかけ。", "id": "b29177e8e6"}, {"sec": "7-2. 細胞・組織・遺伝", "rank": "A", "lv": 2, "type": "cloze", "front": "分裂が盛んで未分化な細胞ほど放射線感受性が高い＝＿＿の法則。", "back": "ベルゴニー・トリボンドーの法則", "note": "成熟した神経細胞や心筋は再生しにくく、放射線感受性は低い。", "id": "5044feb641"}, {"sec": "7-2. 細胞・組織・遺伝", "rank": "A", "lv": 2, "type": "diff", "front": "p53はがん遺伝子とがん抑制遺伝子のどちら？", "back": "がん抑制遺伝子", "note": "ブレーキ＝p53・RB・APC・BRCA。アクセル（がん遺伝子）＝RAS・HER2・MYC。", "id": "5d089667f3"}, {"sec": "7-2. 細胞・組織・遺伝", "rank": "A", "lv": 2, "type": "diff", "front": "骨芽細胞と破骨細胞の役割の違いは？", "back": "骨芽細胞＝骨を作る、破骨細胞＝骨を壊す（吸収）", "note": "骨は骨端線で長くなり、骨膜で太くなる。", "id": "e2710816ca"}, {"sec": "7-2. 細胞・組織・遺伝", "rank": "A", "lv": 3, "type": "basic", "front": "RB遺伝子の異常で起こる小児の眼の腫瘍は？", "back": "網膜芽細胞腫", "note": "BRCA1/2は遺伝性の乳癌・卵巣癌。網膜芽細胞腫はCTで石灰化。", "id": "470fc648e0"}, {"sec": "7-2. 細胞・組織・遺伝", "rank": "B", "lv": 3, "type": "basic", "front": "フィラデルフィア染色体の転座と、目印となる疾患は？", "back": "9番と22番の転座／慢性骨髄性白血病", "note": "BCR-ABL融合遺伝子ができる。", "id": "c3dd0c2320"}, {"sec": "7-2. 細胞・組織・遺伝", "rank": "B", "lv": 3, "type": "basic", "front": "母親からだけ受け継がれる（母系遺伝の）DNAは？", "back": "ミトコンドリアDNA", "note": "精子のミトコンドリアは受精卵に残らないため。", "id": "5f2dd30295"}, {"sec": "7-2. 細胞・組織・遺伝", "rank": "B", "lv": 3, "type": "reverse", "front": "エドワーズ症候群とパトー症候群はそれぞれ何番のトリソミー？", "back": "エドワーズ＝18番、パトー＝13番", "note": "どちらも重い奇形を伴う。ダウン症候群は21番。", "id": "86e0b3416f"}, {"sec": "8. 臨床医学（主な疾患と画像所見）", "rank": "S", "lv": 1, "type": "basic", "front": "発症直後の頭部単純CTで、脳出血はどう写る？", "back": "高吸収（白）", "note": "血液が固まって密度が高くなるので直後から白い。脳梗塞や脳浮腫は時間がたつと低吸収（黒）になる", "id": "a922eace55"}, {"sec": "8. 臨床医学（主な疾患と画像所見）", "rank": "S", "lv": 2, "type": "diff", "front": "超急性期の脳梗塞、単純CTとMRI拡散強調像（DWI）の見え方の違いは？", "back": "CTはほぼ正常／DWIでは早期から高信号", "note": "梗塞はCTより先にDWIでとらえられる。「急性期の脳梗塞はCTで高吸収」は定番のひっかけ", "id": "21dd855b81"}, {"sec": "8. 臨床医学（主な疾患と画像所見）", "rank": "S", "lv": 3, "type": "cloze", "front": "脳梗塞でDWIが高信号の部位では、ADC値は＿＿する。", "back": "低下する", "note": "DWI高信号＋ADC低下＝水分子の拡散制限（細胞性浮腫）。ADCが下がらない高信号はT2 shine-through", "id": "401458d095"}, {"sec": "8. 臨床医学（主な疾患と画像所見）", "rank": "S", "lv": 2, "type": "cloze", "front": "高血圧性脳出血の好発部位は、1位＿＿、2位＿＿。", "back": "1位 被殻／2位 視床", "note": "被殻はレンズ核の外側部分。以下、皮質下・小脳・橋と続く。被殻と視床の順の入れ替えに注意", "id": "5e06b2f2f0"}, {"sec": "8. 臨床医学（主な疾患と画像所見）", "rank": "S", "lv": 3, "type": "basic", "front": "超急性期脳梗塞の単純CTでみられるearly CT signの例を2つ。", "back": "レンズ核の輪郭不明瞭・脳溝の消失", "note": "ほかに皮髄境界の不明瞭化。関連所見として中大脳動脈が白く見えるhyperdense MCA signもある", "id": "656ef515fe"}, {"sec": "8. 臨床医学（主な疾患と画像所見）", "rank": "S", "lv": 1, "type": "basic", "front": "くも膜下出血の最多の原因と、CTで高吸収となる部位は？", "back": "脳動脈瘤の破裂／脳底槽（ヒトデ型）", "note": "突然の激しい頭痛で発症。動脈瘤はWillis動脈輪の分岐部にできやすく、脳の底のすき間に血がたまる", "id": "b8c09aec45"}, {"sec": "8. 臨床医学（主な疾患と画像所見）", "rank": "S", "lv": 1, "type": "diff", "front": "硬膜外血腫と硬膜下血腫、CTでの形の違いは？", "back": "硬膜外＝凸レンズ型／硬膜下＝三日月型", "note": "「外は凸（でこ）、下は三日月」。凸レンズと三日月の入れ替えが毎年のように出るひっかけ", "id": "21f4fb9093"}, {"sec": "8. 臨床医学（主な疾患と画像所見）", "rank": "S", "lv": 3, "type": "basic", "front": "急性硬膜外血腫の出血源として代表的な血管は？", "back": "中硬膜動脈", "note": "側頭骨骨折に伴うことが多い。硬膜は縫合線で骨に強く付くので、血腫は縫合線を越えにくい（凸レンズ型）", "id": "053553aac2"}, {"sec": "8. 臨床医学（主な疾患と画像所見）", "rank": "S", "lv": 2, "type": "reverse", "front": "高齢者の軽い頭部打撲から数週〜数か月後に出てくる頭蓋内血腫は？", "back": "慢性硬膜下血腫", "note": "形は三日月型。物忘れや歩きにくさなど認知症のような症状で見つかることがあり、手術で良くなる", "id": "4d1856e255"}, {"sec": "8. 臨床医学（主な疾患と画像所見）", "rank": "S", "lv": 1, "type": "basic", "front": "肺癌で最も多い組織型と、その好発部位は？", "back": "腺癌／末梢（肺の外側）", "note": "女性・非喫煙者にも多い。覚え方は「腺は外、扁平と小はセンター」（扁平上皮癌・小細胞癌は中枢）", "id": "564acf1bed"}, {"sec": "8. 臨床医学（主な疾患と画像所見）", "rank": "S", "lv": 2, "type": "diff", "front": "肺腺癌と肺扁平上皮癌、好発部位の違いは？", "back": "腺癌＝末梢／扁平上皮癌＝中枢（肺門部）", "note": "中枢と末梢の入れ替えが定番のひっかけ。扁平上皮癌は喫煙と関係が深く、空洞を作ることがある", "id": "d5c004fd06"}, {"sec": "8. 臨床医学（主な疾患と画像所見）", "rank": "S", "lv": 3, "type": "reverse", "front": "中枢発生・喫煙と関係・進行が速く転移しやすいが化学放射線療法が効きやすい肺癌は？", "back": "小細胞癌", "note": "手術より化学放射線療法が中心。腺癌・扁平上皮癌（非小細胞癌）は早期なら手術が基本", "id": "b6d0748bdb"}, {"sec": "8. 臨床医学（主な疾患と画像所見）", "rank": "S", "lv": 1, "type": "basic", "front": "気胸の胸部X線でみられる2つの所見は？", "back": "血管影のない黒い領域＋臓側胸膜線", "note": "しぼんだ肺の縁が細い線として見える。自然気胸は若いやせ型で長身の男性に多い", "id": "c0b97262e7"}, {"sec": "8. 臨床医学（主な疾患と画像所見）", "rank": "S", "lv": 2, "type": "cloze", "front": "気胸は＿＿位で撮影すると見つけやすい。（吸気／呼気）", "back": "呼気位", "note": "呼気で肺が縮むと胸腔内の空気が相対的に目立つ。通常の胸部X線は吸気位なので逆になる点がひっかけ", "id": "7765d00b1a"}, {"sec": "8. 臨床医学（主な疾患と画像所見）", "rank": "S", "lv": 2, "type": "basic", "front": "緊張性気胸で、縦隔はどちらへずれる？", "back": "健側（反対側）", "note": "患側の胸腔内圧が上がって縦隔が押される。閉塞性ショックの原因となり、すぐに脱気が必要", "id": "89cf41e391"}, {"sec": "8. 臨床医学（主な疾患と画像所見）", "rank": "S", "lv": 2, "type": "diff", "front": "大動脈解離のStanford分類で、A型とB型を分ける基準は？", "back": "上行大動脈に解離が及ぶか（A＝含む、B＝含まない）", "note": "入口（エントリー）の場所ではない。A型は緊急手術、B型は降圧などの内科的治療が基本", "id": "6f2cfd04fe"}, {"sec": "8. 臨床医学（主な疾患と画像所見）", "rank": "S", "lv": 1, "type": "basic", "front": "大動脈解離の造影CTでみられる特徴的な所見は？", "back": "剥がれた内膜の線（フラップ）と真腔・偽腔", "note": "突然の胸背部痛で発症する。偽腔が血栓で埋まり造影されないタイプ（偽腔閉塞型）もある", "id": "2d668709de"}, {"sec": "8. 臨床医学（主な疾患と画像所見）", "rank": "S", "lv": 1, "type": "cloze", "front": "肝細胞癌のダイナミックCTでは、動脈相で＿＿し、平衡相で＿＿になる。", "back": "濃染／低吸収", "note": "「早染め・早抜け」。肝細胞癌は動脈から血を受ける多血性腫瘍。背景にB型・C型肝炎や肝硬変", "id": "a4f58abec8"}, {"sec": "8. 臨床医学（主な疾患と画像所見）", "rank": "S", "lv": 2, "type": "diff", "front": "肝血管腫と転移性肝癌、ダイナミックCTでの染まり方の違いは？", "back": "血管腫＝辺縁から結節状に染まり平衡相まで残る／転移＝リング状", "note": "血管腫は「じわじわ染みて居残り」。転移性肝癌は大腸癌などから門脈を経由して起こることが多い", "id": "e2fd30ea52"}, {"sec": "8. 臨床医学（主な疾患と画像所見）", "rank": "S", "lv": 1, "type": "basic", "front": "消化管穿孔で、立位胸部X線でみられる所見は？", "back": "横隔膜下の三日月状のガス（free air）", "note": "消化管の外に漏れた空気が腹腔の一番高い所にたまる。少量のfree airはCTが最も見つけやすい", "id": "6bd45b0a8f"}, {"sec": "8. 臨床医学（主な疾患と画像所見）", "rank": "S", "lv": 2, "type": "basic", "front": "立位がとれない消化管穿孔疑いの患者は、どの体位で撮る？", "back": "左側臥位（右側を上）", "note": "肝臓の外側（右側腹部）にたまるガスを見る。胃泡と重ならないよう右を上にするのがポイント", "id": "366b672fc2"}, {"sec": "8. 臨床医学（主な疾患と画像所見）", "rank": "S", "lv": 1, "type": "reverse", "front": "立位腹部X線で、鏡面像（ニボー）と拡張した腸管がみられた。疑う疾患は？", "back": "腸閉塞（イレウス）", "note": "ニボー＝空気と液体の水平な境界。立位や側臥位で水平線として見え、仰臥位では見えない", "id": "b5f6ca3162"}, {"sec": "8. 臨床医学（主な疾患と画像所見）", "rank": "S", "lv": 3, "type": "diff", "front": "腹部X線で、拡張した小腸と大腸の見分け方は？", "back": "小腸＝ケルクリング襞（全周を横切る）／大腸＝ハウストラ（全周は横切らない）", "note": "小腸は腹部の中央寄り、大腸は辺縁を枠のように走ることも手がかりになる", "id": "aa70bd00b8"}, {"sec": "8. 臨床医学（主な疾患と画像所見）", "rank": "S", "lv": 2, "type": "diff", "front": "前立腺癌と腎細胞癌の骨転移、X線での見え方の違いは？", "back": "前立腺癌＝造骨性（白く硬い）／腎細胞癌＝溶骨性（黒く抜ける）", "note": "乳癌は溶骨性と造骨性の混合型もある。骨シンチ（Tc-99mリン酸化合物）では多発する集積として写る", "id": "a0d2317e6f"}, {"sec": "8. 臨床医学（主な疾患と画像所見）", "rank": "S", "lv": 3, "type": "reverse", "front": "溶骨性骨転移（骨が黒く抜ける）を起こす代表的な疾患を4つ。", "back": "腎細胞癌・甲状腺癌・肺癌・多発性骨髄腫", "note": "前立腺癌（造骨性）との区別が定番。骨転移は胸椎・腰椎など体幹に近い骨に多い", "id": "f890c97cbd"}, {"sec": "8. 臨床医学（主な疾患と画像所見）", "rank": "S", "lv": 3, "type": "basic", "front": "骨シンチで集積しにくく偽陰性になりやすい疾患と、その頭蓋骨X線所見は？", "back": "多発性骨髄腫／打ち抜き像（punched-out）", "note": "骨を作る反応（骨芽細胞の活動）が乏しいため集積しにくい。骨の評価はX線やMRIを組み合わせる", "id": "e85c8e515c"}, {"sec": "8. 臨床医学（主な疾患と画像所見）", "rank": "A", "lv": 2, "type": "basic", "front": "前壁の心筋梗塞で詰まっている冠動脈は？", "back": "左前下行枝（LAD）", "note": "下壁は右冠動脈、側壁は左回旋枝が多い。心電図はST上昇→異常Q波、血液ではトロポニンが上昇", "id": "264d2949d6"}, {"sec": "8. 臨床医学（主な疾患と画像所見）", "rank": "A", "lv": 2, "type": "basic", "front": "乳癌を疑うマンモグラフィ所見を2つ。", "back": "スピキュラを伴う腫瘤・集簇した微細石灰化", "note": "石灰化は「細かく・不揃いで・集まる」が悪性の決め手。大きく丸い粗い石灰化は良性が多い", "id": "b2e9793441"}, {"sec": "8. 臨床医学（主な疾患と画像所見）", "rank": "A", "lv": 2, "type": "diff", "front": "前立腺癌と前立腺肥大症、好発する領域の違いは？", "back": "癌＝辺縁域（外側・後ろ側）／肥大症＝移行域（内側）", "note": "辺縁域は直腸側なので直腸診で触れる。癌はPSA上昇、MRIのT2強調像で低信号・DWIで高信号", "id": "c5d6a80d1a"}, {"sec": "8. 臨床医学（主な疾患と画像所見）", "rank": "B", "lv": 3, "type": "basic", "front": "肺結核の好発部位（区域）は？", "back": "上葉のS1・S2と下葉のS6", "note": "空洞を作りやすい。空気感染なので撮影時は医療者がN95マスクを着けるなどの感染対策が必要", "id": "c98b52bb2c"}, {"sec": "8-2. 小児・高齢者", "rank": "S", "lv": 1, "type": "cloze", "front": "体の水分の割合は、新生児で約＿＿%、高齢者で約＿＿%。", "back": "新生児 約80%／高齢者 約50%", "note": "成人は約60%。高齢者は水分が少なくのどの渇きも感じにくいため、脱水になりやすい", "id": "26bf6355ae"}, {"sec": "8-2. 小児・高齢者", "rank": "S", "lv": 1, "type": "basic", "front": "先天性心疾患で最も多いのは？", "back": "心室中隔欠損（VSD）", "note": "左→右の短絡なので通常チアノーゼは起こさない。チアノーゼを起こす代表はファロー四徴症", "id": "8c384ff7eb"}, {"sec": "8-2. 小児・高齢者", "rank": "S", "lv": 1, "type": "basic", "front": "ファロー四徴症の4つは？", "back": "心室中隔欠損・肺動脈狭窄・大動脈騎乗・右室肥大", "note": "「あな・せま・のり・みぎ」。「左室肥大」「心房中隔欠損」を混ぜるのが定番のひっかけ", "id": "a25da50d04"}, {"sec": "8-2. 小児・高齢者", "rank": "S", "lv": 2, "type": "basic", "front": "ファロー四徴症の胸部X線で、心陰影はどんな形？", "back": "木靴型", "note": "右室肥大で心尖が持ち上がり、肺動脈が細いので左第2弓がへこむ。チアノーゼを起こす", "id": "15d9040a20"}, {"sec": "8-2. 小児・高齢者", "rank": "S", "lv": 1, "type": "basic", "front": "小児の悪性腫瘍で最も多いのは？", "back": "白血病（急性リンパ性白血病が多い）", "note": "2番目は脳腫瘍。小児の脳腫瘍は大人と違い、小脳など後頭蓋窩（テント下）に多い", "id": "ff759a6509"}, {"sec": "8-2. 小児・高齢者", "rank": "S", "lv": 2, "type": "diff", "front": "神経芽腫とウィルムス腫瘍、発生する臓器と石灰化の違いは？", "back": "神経芽腫＝副腎髄質・交感神経、石灰化が多い／ウィルムス＝腎、石灰化は少ない", "note": "臓器の入れ替えが定番のひっかけ。「神経芽腫は副腎、ウィルムスは腎、網膜芽は眼」", "id": "025b56f492"}, {"sec": "8-2. 小児・高齢者", "rank": "S", "lv": 3, "type": "basic", "front": "神経芽腫で上昇する尿中物質と、集積する核医学検査は？", "back": "尿中VMA・HVA／MIBGシンチ", "note": "VMA・HVAはカテコールアミンの代謝産物。MIBGは副腎髄質由来の褐色細胞腫にも集積する", "id": "7416004d4c"}, {"sec": "8-2. 小児・高齢者", "rank": "S", "lv": 3, "type": "reverse", "front": "小児の小脳（後頭蓋窩）に好発する悪性脳腫瘍は？", "back": "髄芽腫", "note": "第4脳室の近くにでき、水頭症を起こしやすい。髄液を通じて脊髄などへ播種しやすい", "id": "9c8417d1ed"}, {"sec": "8-2. 小児・高齢者", "rank": "S", "lv": 2, "type": "basic", "front": "骨肉腫の好発年齢と好発部位は？", "back": "10代／膝のまわり（大腿骨遠位・脛骨近位）の骨幹端", "note": "骨髄腫を除く骨の悪性腫瘍で最多。肺に転移しやすいので胸部CTで転移を確認する", "id": "0debbb0c31"}, {"sec": "8-2. 小児・高齢者", "rank": "S", "lv": 3, "type": "diff", "front": "骨肉腫とユーイング肉腫、X線の骨膜反応と好発部位の違いは？", "back": "骨肉腫＝骨幹端、コッドマン三角・旭日状／ユーイング＝骨幹、タマネギの皮状", "note": "高齢者の骨の悪性腫瘍は、原発性より転移性骨腫瘍や多発性骨髄腫が多い", "id": "b0f5a4dc54"}, {"sec": "8-2. 小児・高齢者", "rank": "S", "lv": 2, "type": "cloze", "front": "高齢者では肺活量は＿＿し、残気量は＿＿する。", "back": "低下／増加", "note": "肺の弾力が落ちて吐き切れなくなるため残気量は増える。「残気量も減る」は定番のひっかけ", "id": "4ff2018b38"}, {"sec": "8-2. 小児・高齢者", "rank": "S", "lv": 2, "type": "basic", "front": "骨粗鬆症の骨密度を測るDXA法で、使うX線と主な測定部位は？", "back": "2種類のエネルギーのX線／腰椎と大腿骨近位部", "note": "「1種類のエネルギー」はひっかけ。骨粗鬆症はエストロゲンが減る閉経後の女性に多い", "id": "7d60012d83"}, {"sec": "8-2. 小児・高齢者", "rank": "S", "lv": 1, "type": "reverse", "front": "MRIで海馬（側頭葉内側）の萎縮がみられた。最も疑う認知症は？", "back": "アルツハイマー型認知症", "note": "認知症で最も多い型。脳血流SPECTでは後部帯状回・頭頂葉・側頭葉の血流が下がる", "id": "a4e42f7ff5"}, {"sec": "8-2. 小児・高齢者", "rank": "S", "lv": 3, "type": "diff", "front": "アルツハイマー型とレビー小体型、脳血流SPECTで血流が下がる部位の違いは？", "back": "AD＝後部帯状回・頭頂葉・側頭葉／レビー＝後頭葉", "note": "後頭葉の低下はレビー小体型。レビー小体型では幻視やパーキンソン症状も手がかりになる", "id": "476be5377f"}, {"sec": "8-2. 小児・高齢者", "rank": "S", "lv": 3, "type": "basic", "front": "レビー小体型認知症で集積が低下する核医学検査を2つ。", "back": "MIBG心筋シンチ（心臓）・DaT SPECT（線条体）", "note": "パーキンソン病でも同じように低下する。アルツハイマー型ではどちらも基本的に低下しない", "id": "890e02c8fe"}, {"sec": "8-2. 小児・高齢者", "rank": "A", "lv": 3, "type": "cloze", "front": "発達の目安：首すわり＿＿か月、ひとり座り＿＿か月、ひとり歩き1歳〜1歳半。", "back": "3〜4か月／6〜7か月", "note": "大泉門は1歳半〜2歳ごろ、小泉門は生後数か月以内に閉じる。体重は1歳で出生時の約3倍", "id": "fcac3d27c0"}, {"sec": "8-2. 小児・高齢者", "rank": "A", "lv": 2, "type": "diff", "front": "ペルテス病と大腿骨頭すべり症、好発年齢と病態の違いは？", "back": "ペルテス＝4〜8歳の男児、骨頭の血流途絶で壊死／すべり症＝思春期の肥満男子、骨端線で骨頭がずれる", "note": "ペルテス病を「女児」「思春期」にするのがひっかけ。女児に多いのは発育性股関節形成不全", "id": "30d124e3bd"}, {"sec": "8-2. 小児・高齢者", "rank": "A", "lv": 2, "type": "diff", "front": "クループと急性喉頭蓋炎、X線の撮影方向と所見の違いは？", "back": "クループ＝正面像でsteeple sign／喉頭蓋炎＝側面像でthumb sign", "note": "喉頭蓋炎は寝かせると窒息のおそれがあり、無理に仰向けにしない。クループは犬が吠えるような咳", "id": "c7be8c0e35"}, {"sec": "8-2. 小児・高齢者", "rank": "A", "lv": 2, "type": "basic", "front": "正常圧水頭症の3つの症状は？", "back": "歩行障害・認知症・尿失禁", "note": "「歩けない・忘れる・もれる」。CT・MRIで脳室が大きく、シャント手術で良くなる「治る認知症」", "id": "7e8b4653ef"}, {"sec": "8-2. 小児・高齢者", "rank": "A", "lv": 2, "type": "basic", "front": "パーキンソン病でドパミン神経が減る部位は？", "back": "中脳の黒質", "note": "「小脳」はひっかけ。症状は振戦・固縮・無動・姿勢反射障害。DaT SPECTで線条体の集積が低下", "id": "47ca7730df"}, {"sec": "9. 公衆衛生・医療安全・感染対策・救急", "rank": "S", "lv": 1, "type": "basic", "front": "標準予防策で「感染のおそれがあるもの」として扱う対象は？", "back": "全患者の血液・体液・分泌物・排泄物・傷のある皮膚・粘膜", "note": "「感染症とわかっている患者だけ」は誤り。汗は対象外。手袋を外した後も手指衛生が必要", "id": "f1d0e5f97e"}, {"sec": "9. 公衆衛生・医療安全・感染対策・救急", "rank": "S", "lv": 1, "type": "basic", "front": "空気感染予防策が必要な3疾患は？", "back": "結核・麻疹・水痘", "note": "「結・麻・水は空を飛ぶ」。医療者はN95マスク、患者は陰圧個室に入ってもらう", "id": "47b5de043d"}, {"sec": "9. 公衆衛生・医療安全・感染対策・救急", "rank": "S", "lv": 2, "type": "diff", "front": "麻疹と風疹、感染経路の違いは？", "back": "麻疹＝空気感染／風疹＝飛沫感染", "note": "名前に「風」があるのに風疹は飛沫。インフルエンザ・流行性耳下腺炎・百日咳も飛沫感染", "id": "e1b3854280"}, {"sec": "9. 公衆衛生・医療安全・感染対策・救急", "rank": "S", "lv": 2, "type": "basic", "front": "空気感染する患者本人が着けるマスクは？", "back": "サージカルマスク", "note": "N95マスクは医療者が着けるもの。患者本人にはしぶきを広げないためのサージカルマスク", "id": "42599e4a89"}, {"sec": "9. 公衆衛生・医療安全・感染対策・救急", "rank": "S", "lv": 2, "type": "reverse", "front": "手袋・ガウン・器具の専用化で防ぐ感染経路と、その代表的な病原体は？", "back": "接触感染／MRSA・ノロウイルス・疥癬・C.ディフィシル", "note": "ポータブル撮影の後は、患者に触れた装置やカセッテも消毒する。病棟間で装置を介して広がるため", "id": "94e8dccb16"}, {"sec": "9. 公衆衛生・医療安全・感染対策・救急", "rank": "S", "lv": 1, "type": "cloze", "front": "グルタラール・過酢酸・フタラールは＿＿水準消毒薬。", "back": "高水準", "note": "芽胞（最も殺しにくい細菌の殻）まで殺せる。刺激が強く人体には使わず、内視鏡などの器具に使う", "id": "e608e1a37f"}, {"sec": "9. 公衆衛生・医療安全・感染対策・救急", "rank": "S", "lv": 2, "type": "basic", "front": "ノロウイルスに有効な消毒薬は？", "back": "次亜塩素酸ナトリウム", "note": "アルコールは効きにくい。手は石けんと流水で洗い流す。吐物の処理にも次亜塩素酸ナトリウムを使う", "id": "5c18c7b58d"}, {"sec": "9. 公衆衛生・医療安全・感染対策・救急", "rank": "S", "lv": 3, "type": "cloze", "front": "ポビドンヨードは＿＿水準、クロルヘキシジンは＿＿水準の消毒薬。", "back": "中／低", "note": "中水準＝次亜塩素酸Na・エタノール・ポビドンヨード、低水準＝ベンザルコニウム塩化物・クロルヘキシジン", "id": "8487643f80"}, {"sec": "9. 公衆衛生・医療安全・感染対策・救急", "rank": "S", "lv": 1, "type": "basic", "front": "針刺し事故を防ぐため、使用後の針で禁止されている行為は？", "back": "リキャップ（キャップを戻す）", "note": "使った針はすぐ耐貫通性の廃棄容器へ。事故時はすぐ流水で洗い、報告して患者のHBV・HCV・HIVを確認", "id": "b4877407f9"}, {"sec": "9. 公衆衛生・医療安全・感染対策・救急", "rank": "S", "lv": 1, "type": "diff", "front": "インシデントとアクシデントの違いは？", "back": "インシデント＝実施されなかった・影響なし/軽微／アクシデント＝患者に障害が生じた", "note": "インシデント＝ヒヤリ・ハット。報告の目的は再発防止で、個人を罰するためではない", "id": "5eb25a9038"}, {"sec": "9. 公衆衛生・医療安全・感染対策・救急", "rank": "S", "lv": 1, "type": "basic", "front": "患者確認の基本は？", "back": "フルネームと生年月日など2つ以上の情報を、患者自身に名乗ってもらう", "note": "リストバンドも使う。撮影部位や左右も依頼文書と照合する。病室番号は識別に使わない", "id": "15749b921f"}, {"sec": "9. 公衆衛生・医療安全・感染対策・救急", "rank": "S", "lv": 2, "type": "basic", "front": "患者確認で「○○さんですね？」と聞いてはいけない理由は？", "back": "聞き間違いでも「はい」と答えてしまうから", "note": "耳が遠い人や緊張している人は特に返事をしがち。必ず患者自身に名前を言ってもらう", "id": "8116cf572c"}, {"sec": "9. 公衆衛生・医療安全・感染対策・救急", "rank": "S", "lv": 1, "type": "cloze", "front": "成人の胸骨圧迫は、胸骨の下半分を深さ約＿＿cm、テンポ＿＿回/分。", "back": "約5 cm（6 cmを超えない）／100〜120回/分", "note": "「強く・速く・絶え間なく」。圧迫30回：人工呼吸2回。AEDのショック後はすぐ圧迫を再開", "id": "8c8ec041da"}, {"sec": "9. 公衆衛生・医療安全・感染対策・救急", "rank": "S", "lv": 2, "type": "basic", "front": "しゃくり上げるような呼吸（死戦期呼吸）がある場合の判断は？", "back": "呼吸なしと判断し、胸骨圧迫を始める", "note": "反応がなく普段どおりの呼吸がなければ心停止として対応する。迷ったら圧迫を始める", "id": "9897432edf"}, {"sec": "9. 公衆衛生・医療安全・感染対策・救急", "rank": "S", "lv": 3, "type": "basic", "front": "MRI室内で患者が心停止した。救命処置はどこで行う？", "back": "患者を室外へ出してから行う", "note": "AEDや鉄製のストレッチャー・酸素ボンベは強い磁場に引き込まれるので、室内へ持ち込まない", "id": "08393ad6ba"}, {"sec": "9. 公衆衛生・医療安全・感染対策・救急", "rank": "S", "lv": 1, "type": "basic", "front": "ヨード造影剤注入中にじんましんと息苦しさ。最初に行うことは？", "back": "注入を中止し、応援（医師）を呼ぶ", "note": "「止める・呼ぶ・残す」。静脈ルートは抜かずに残し、患者を一人にしない。血圧低下なら下肢挙上", "id": "1d241c3422"}, {"sec": "9. 公衆衛生・医療安全・感染対策・救急", "rank": "A", "lv": 2, "type": "basic", "front": "アナフィラキシーショックは、ショックの4分類のどれ？", "back": "血液分布異常性ショック", "note": "敗血症性・神経原性も同じ分類。大量出血・脱水は循環血液量減少性、心筋梗塞は心原性", "id": "da3ac79327"}, {"sec": "9. 公衆衛生・医療安全・感染対策・救急", "rank": "A", "lv": 3, "type": "reverse", "front": "緊張性気胸・心タンポナーデ・肺塞栓によるショックの分類は？", "back": "閉塞性ショック", "note": "心臓の外から圧迫されたり、血液の通り道がふさがれたりして心拍出量が落ちる", "id": "8038ad5120"}, {"sec": "9. 公衆衛生・医療安全・感染対策・救急", "rank": "A", "lv": 3, "type": "basic", "front": "WHOの手指衛生5つのタイミングのうち、「〜の後」の3つは？", "back": "体液に触れたおそれの後・患者に触れた後・患者の周りの物に触れた後", "note": "「前」は患者に触れる前と清潔・無菌操作の前の2つ。目に見える汚れがあれば石けんと流水", "id": "e81f0479d1"}, {"sec": "9. 公衆衛生・医療安全・感染対策・救急", "rank": "A", "lv": 2, "type": "basic", "front": "使用済みの注射針を捨てる容器のバイオハザードマークの色は？", "back": "黄", "note": "赤＝液状・泥状（血液など）、橙＝固形物（血のついたガーゼなど）。赤と黄の入れ替えに注意", "id": "51fef5079e"}, {"sec": "9. 公衆衛生・医療安全・感染対策・救急", "rank": "A", "lv": 2, "type": "diff", "front": "罹患率と有病率の違いは？", "back": "罹患率＝一定期間に新しく発症した割合／有病率＝ある時点で病気をもつ割合", "note": "慢性の病気は罹患率が低くても、治りにくく患者がたまるので有病率が高くなる", "id": "43d83744c3"}, {"sec": "9. 公衆衛生・医療安全・感染対策・救急", "rank": "A", "lv": 3, "type": "diff", "front": "感度と特異度の違いは？", "back": "感度＝病気の人を陽性とする割合／特異度＝病気でない人を陰性とする割合", "note": "スクリーニングには感度の高い検査、確定診断には特異度の高い検査が向いている", "id": "d63322764b"}, {"sec": "9. 公衆衛生・医療安全・感染対策・救急", "rank": "A", "lv": 1, "type": "basic", "front": "日本人の死因の第1位は？", "back": "悪性新生物（がん）", "note": "2位は心疾患（目安、最新の人口動態統計で確認）。「1位 心疾患」とするひっかけに注意", "id": "3434fb41d9"}, {"sec": "9. 公衆衛生・医療安全・感染対策・救急", "rank": "B", "lv": 3, "type": "basic", "front": "ハインリッヒの法則の比率（重大事故：軽微な事故：ヒヤリ・ハット）は？", "back": "1：29：300", "note": "重大事故の裏には多くのヒヤリ・ハットがある。インシデントの段階で報告・対策することが大切な理由", "id": "01e4f3ba74"}, {"sec": "9. 公衆衛生・医療安全・感染対策・救急", "rank": "B", "lv": 3, "type": "basic", "front": "がん検診（マンモグラフィなど）は何次予防？", "back": "二次予防（早期発見・早期治療）", "note": "一次予防＝病気にならない（予防接種・生活習慣）、三次予防＝リハビリ・再発防止", "id": "cf58808760"}, {"sec": "9-2. 薬理（検査で使う薬）", "rank": "S", "lv": 1, "type": "basic", "front": "投与経路を、効き始めが速い順に並べると？", "back": "静脈注射 ＞ 筋肉注射 ＞ 皮下注射 ＞ 経口", "note": "「経口が最も速い」は誤り。舌下錠は肝臓を通らないので飲み薬より速く効く", "id": "6766f42144"}, {"sec": "9-2. 薬理（検査で使う薬）", "rank": "S", "lv": 2, "type": "basic", "front": "初回通過効果とは？", "back": "経口薬が腸で吸収後、肝臓を通るときに一部が分解されること", "note": "舌下錠（ニトログリセリンなど）は口の粘膜から吸収され肝臓を通らないので、この効果を受けない", "id": "6a42b81537"}, {"sec": "9-2. 薬理（検査で使う薬）", "rank": "S", "lv": 1, "type": "basic", "front": "薬の代謝と排泄を主に行う臓器は？", "back": "代謝＝肝臓／排泄＝腎臓", "note": "ヨード造影剤もガドリニウム造影剤もほとんどが腎臓から尿へ出る。腎機能が悪いと体に長く残る", "id": "d73e684897"}, {"sec": "9-2. 薬理（検査で使う薬）", "rank": "S", "lv": 3, "type": "basic", "front": "一部が胆汁中に排泄される、肝細胞に取り込まれるMRI造影剤は？", "back": "Gd-EOB-DTPA（ガドキセト酸）", "note": "肝細胞相で正常な肝臓が白く染まり、肝細胞癌など肝細胞機能のない病変は低信号になる", "id": "622f40684f"}, {"sec": "9-2. 薬理（検査で使う薬）", "rank": "S", "lv": 1, "type": "reverse", "front": "胃のX線検査などで、消化管の動きを止めるために使う抗コリン薬は？", "back": "ブチルスコポラミン（臭化物）", "note": "鎮痙薬。副作用は口の渇き・動悸・目のかすみで、検査後しばらく車の運転を控えてもらう", "id": "d26a28e582"}, {"sec": "9-2. 薬理（検査で使う薬）", "rank": "S", "lv": 2, "type": "basic", "front": "ブチルスコポラミンの禁忌を4つ。", "back": "緑内障・前立腺肥大による排尿障害・重い心疾患・麻痺性イレウス", "note": "覚え方は「目・おしっこ・心臓・腸」。使えない人には代わりにグルカゴンを使うことが多い", "id": "172cbe45fd"}, {"sec": "9-2. 薬理（検査で使う薬）", "rank": "S", "lv": 2, "type": "diff", "front": "鎮痙薬で、緑内障に禁忌なのと褐色細胞腫に禁忌なのは、それぞれどちら？", "back": "緑内障＝ブチルスコポラミン／褐色細胞腫＝グルカゴン", "note": "入れ替えが定番のひっかけ。グルカゴンは褐色細胞腫で血圧を急上昇させる。糖尿病の人は血糖に注意", "id": "4b7289ebdd"}, {"sec": "9-2. 薬理（検査で使う薬）", "rank": "S", "lv": 2, "type": "basic", "front": "冠動脈CTでニトログリセリンを使う目的と、その禁忌は？", "back": "冠動脈を広げてよく写す／低血圧・PDE5阻害薬服用中", "note": "PDE5阻害薬（勃起不全治療薬）との併用で血圧が大きく下がり危険。舌下錠やスプレーで使う", "id": "614ef45121"}, {"sec": "9-2. 薬理（検査で使う薬）", "rank": "S", "lv": 3, "type": "basic", "front": "冠動脈CTでβ遮断薬を使う目的と、注意が必要な疾患は？", "back": "心拍数を下げて画像のブレを減らす／気管支喘息・高度な徐脈", "note": "β遮断で気管支が収縮しうるため喘息に注意。心拍数が低いほど拡張期が長く冠動脈がきれいに写る", "id": "2fa9331118"}, {"sec": "9-2. 薬理（検査で使う薬）", "rank": "S", "lv": 2, "type": "basic", "front": "ヨード造影剤の禁忌を2つ。", "back": "ヨード造影剤への過敏症の既往・重篤な甲状腺疾患", "note": "気管支喘息や重い腎障害は慎重投与（添付文書で確認）。腎機能は造影前にeGFRで確認する", "id": "d79723d32c"}, {"sec": "9-2. 薬理（検査で使う薬）", "rank": "S", "lv": 3, "type": "basic", "front": "ヨード造影剤使用時、メトホルミン（ビグアナイド系）服用者で注意する副作用は？", "back": "乳酸アシドーシス", "note": "造影剤で腎機能が落ちるとメトホルミンが体にたまる。休薬の期間などは施設の基準に従う", "id": "ef54ebe27c"}, {"sec": "9-2. 薬理（検査で使う薬）", "rank": "S", "lv": 1, "type": "basic", "front": "消化管穿孔が疑われる患者の消化管造影に使う造影剤は？", "back": "水溶性ヨード造影剤（ガストログラフィン）", "note": "硫酸バリウムはおなかの中に漏れると腹膜炎を悪化させるため、穿孔が疑われるときは使わない", "id": "2536ce8eec"}, {"sec": "9-2. 薬理（検査で使う薬）", "rank": "S", "lv": 3, "type": "basic", "front": "ガストログラフィンを誤嚥すると起こりうることは？", "back": "肺水腫", "note": "高浸透圧のため肺に水を引き込む。誤嚥しやすい高齢者などに使うときは特に注意する", "id": "30e34281e0"}, {"sec": "9-2. 薬理（検査で使う薬）", "rank": "S", "lv": 1, "type": "basic", "front": "バリウム検査の後、患者に指導することは？", "back": "下剤と十分な水分で早く排出する", "note": "バリウムが腸の中で固まると便秘や腸閉塞の原因になる。白い便が出なければ連絡してもらう", "id": "f9c994d030"}, {"sec": "9-2. 薬理（検査で使う薬）", "rank": "A", "lv": 2, "type": "basic", "front": "重い腎機能障害の人にガドリニウム造影剤を使うと注意が必要な病気は？", "back": "腎性全身性線維症（NSF）", "note": "皮膚や内臓が硬くなる病気。造影前にeGFRを確認し、腎機能が重く落ちた人には原則使わない", "id": "362889bd80"}, {"sec": "9-2. 薬理（検査で使う薬）", "rank": "A", "lv": 3, "type": "basic", "front": "ガドリニウム造影剤をくり返し使うと沈着しうる脳の部位は？", "back": "歯状核・淡蒼球", "note": "T1強調像で高信号として見える。沈着を減らすため、より安定な環状（マクロ環）型が主に使われる", "id": "ab857957b5"}, {"sec": "9-2. 薬理（検査で使う薬）", "rank": "A", "lv": 2, "type": "basic", "front": "ヨード造影剤で副作用が出た人に、ガドリニウム造影剤は禁忌？", "back": "禁忌ではない（別の薬）", "note": "ヨードとガドリニウムは別の薬。ただしアレルギーを起こしやすい体質として注意して観察する", "id": "b51224f09c"}, {"sec": "9-2. 薬理（検査で使う薬）", "rank": "A", "lv": 1, "type": "basic", "front": "造影剤アナフィラキシーの第一選択薬と、その投与経路は？", "back": "アドレナリン／筋肉注射", "note": "医師が行う。ステロイドは効き始めが遅いので第一選択ではなく、抗ヒスタミン薬とともに補助", "id": "2670e5c84a"}, {"sec": "9-2. 薬理（検査で使う薬）", "rank": "A", "lv": 2, "type": "diff", "front": "ワルファリンとヘパリン、それぞれの効果を打ち消す（拮抗する）薬は？", "back": "ワルファリン＝ビタミンK／ヘパリン＝プロタミン", "note": "「ワ・ケー、ヘ・プロ」。ワルファリンはPT-INRで管理し、納豆（ビタミンK）で効きが落ちる", "id": "b6ec2ac7db"}, {"sec": "9-2. 薬理（検査で使う薬）", "rank": "A", "lv": 3, "type": "cloze", "front": "治療係数＝＿＿÷＿＿で、値が大きいほど安全。", "back": "LD50 ÷ ED50", "note": "LD50＝半数が死ぬ量、ED50＝半数に効く量。効く量と死ぬ量が離れているほど安全。入れ替えに注意", "id": "3f0de7a6a6"}, {"sec": "9-2. 薬理（検査で使う薬）", "rank": "B", "lv": 3, "type": "diff", "front": "毒薬と劇薬の表示の違いは？", "back": "毒薬＝黒地に白枠・白字「毒」／劇薬＝白地に赤枠・赤字「劇」", "note": "毒薬は鍵をかけて保管する。「毒は黒、劇は赤」と色で覚え、地と文字の色の入れ替えに注意", "id": "0c67ef668f"}];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const DAY = 864e5, now = () => Date.now();
const today = () => new Date().toISOString().slice(0, 10);
const store = { get(k, d) { try { const v = localStorage.getItem("kc_" + k + KSFX); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem("kc_" + k + KSFX, JSON.stringify(v)); } catch (e) {} } };
let S = store.get("state", {});          // id -> {due, ivl, ease, reps, lapses}
let log = store.get("log", { day: today(), done: 0, newSeen: 0 });
if (log.day !== today()) log = { day: today(), done: 0, newSeen: 0 };
let newPerDay = store.get("newPerDay", 20);
let mode = "srs", sec = "", lvMin = 0, typing = store.get("typing", false);
let queue = [], cur = null, flipped = false, typed = "";
const SECS = [...new Set(CARDS.map((c) => c.sec))];
const TYPE = { basic: "一問一答", cloze: "穴埋め", reverse: "逆向き", diff: "違い" };

function lvOK(c) { return lvMin === 0 ? true : lvMin === 1 ? c.lv === 1 : lvMin === 2 ? c.lv >= 2 : c.lv === 3; }
function filtered() { return CARDS.filter((c) => (!sec || c.sec === sec) && lvOK(c)); }
function buildQueue() {
  const t = now(); let list = filtered();
  if (mode === "srs") {
    const due = list.filter((c) => S[c.id] && S[c.id].due <= t).sort((a, b) => S[a.id].due - S[b.id].due);
    const left = Math.max(0, newPerDay - log.newSeen);
    const fresh = list.filter((c) => !S[c.id]).sort((a, b) => a.lv - b.lv || 0).slice(0, left);
    queue = [...due, ...shuffle(fresh)];
  } else if (mode === "oni") {
    queue = shuffle(list.filter((c) => c.lv === 3 || (c.lv === 2 && (c.type === "diff" || c.type === "reverse"))));
  } else if (mode === "weak") {
    queue = shuffle(list.filter((c) => S[c.id] && (S[c.id].lapses > 0 || S[c.id].ease < 2.2)));
  } else queue = shuffle(list);
}
function preview(c, g) {
  const s = S[c.id] || { ivl: 0, ease: 2.5 };
  if (g === 0) return "10分";
  let ivl = s.ivl || 0;
  if (g === 1) ivl = Math.max(1, ivl * 1.2); else if (g === 2) ivl = ivl ? ivl * s.ease : 1; else ivl = ivl ? ivl * s.ease * 1.3 : 4;
  ivl = Math.round(ivl);
  return ivl >= 30 ? Math.round(ivl / 30) + "か月" : ivl + "日";
}
function grade(g) {
  if (window.KQStats) KQStats.hit(g > 0);
  const c = cur; const s = S[c.id] || { ivl: 0, ease: 2.5, reps: 0, lapses: 0, due: 0 };
  const isNew = !S[c.id];
  if (g === 0) { s.lapses++; s.ease = Math.max(1.3, s.ease - 0.2); s.ivl = 0; s.due = now() + 10 * 60 * 1000; queue.splice(Math.min(queue.length, 4), 0, c); }
  else {
    if (g === 1) { s.ease = Math.max(1.3, s.ease - 0.15); s.ivl = Math.max(1, (s.ivl || 0) * 1.2); }
    else if (g === 2) { s.ivl = s.ivl ? s.ivl * s.ease : 1; }
    else { s.ease += 0.15; s.ivl = s.ivl ? s.ivl * s.ease * 1.3 : 4; }
    s.ivl = Math.round(s.ivl); s.due = now() + s.ivl * DAY;
  }
  s.reps++; S[c.id] = s;
  if (isNew) log.newSeen++;
  log.done++;
  store.set("state", S); store.set("log", log);
  next();
}
function next() { cur = queue.shift() || null; flipped = false; typed = ""; render(); renderQueue(); }
function render() {
  if (!cur) {
    const msg = mode === "srs" ? "今日の分はおしまい。" : mode === "weak" ? "苦手カードはまだない。" : "この条件のカードはない。";
    const sub = mode === "srs" ? "期限が来たカードは明日以降にまた出てくる。続けたいときは「鬼モード」か「全部シャッフル」へ。" : mode === "weak" ? "「もう一回」「難しい」を押したカードがここにたまる。" : "分野や難易度の条件をゆるめてみて。";
    $("stage").innerHTML = `<div class="card done"><h2>${msg}</h2><p class="sub">${sub}</p><div class="row2"><button class="btn" id="goAll">全部シャッフルで続ける</button></div></div>`;
    $("goAll").addEventListener("click", () => setMode("all")); return;
  }
  const c = cur, lvc = `var(--lv${c.lv})`;
  const needType = typing || mode === "oni";
  let html = `<div class="card" style="--lvc:${lvc}"><div class="meta"><span class="tag lv">${"★".repeat(c.lv)}</span><span class="tag">${esc(TYPE[c.type] || c.type)}</span><span class="tag">${esc(c.rank)}ランク</span><span>${esc(c.sec)}</span>${S[c.id] ? "" : '<span class="tag">新規</span>'}</div>
    <p class="front">${esc(c.front)}</p>`;
  if (!flipped) {
    if (needType) html += `<div class="ansin"><input id="ans" type="text" autocomplete="off" placeholder="答えを入力（Enterでめくる）"><button class="btn" id="flipBtn">めくる</button></div>`;
    else html += `<div><button class="btn" id="flipBtn">答えを見る</button> <span class="keys">スペースでもめくれる</span></div>`;
  } else {
    html += `<div class="back">${typed ? `<div class="mine">あなたの答え：${esc(typed)}</div>` : ""}<div class="a">${esc(c.back)}</div>${c.note ? `<div class="n">${esc(c.note)}</div>` : ""}</div>`;
  }
  html += `</div>`;
  if (flipped) html += `<div class="grades" role="group" aria-label="採点">${[["again", "もう一回"], ["hard", "難しい"], ["good", "OK"], ["easy", "簡単"]].map(([k, l], i) => `<button class="g ${k}" data-g="${i}">${l}<small>${i + 1}・${preview(c, i)}</small></button>`).join("")}</div>`;
  $("stage").innerHTML = html;
  if (!flipped) {
    const flip = () => { const el = $("ans"); typed = el ? el.value.trim() : ""; flipped = true; render(); };
    $("flipBtn").addEventListener("click", flip);
    const el = $("ans"); if (el) { el.focus(); el.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); flip(); } }); }
  } else document.querySelectorAll(".g").forEach((b) => b.addEventListener("click", () => grade(+b.dataset.g)));
}
document.addEventListener("keydown", (e) => {
  if (!cur || e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  if (!flipped && (e.key === " " || e.key === "Enter")) { e.preventDefault(); $("flipBtn")?.click(); }
  else if (flipped && ["1", "2", "3", "4"].includes(e.key)) grade(+e.key - 1);
});
function renderQueue() {
  const t = now(), list = filtered();
  $("qDue").textContent = list.filter((c) => S[c.id] && S[c.id].due <= t).length;
  $("qNew").textContent = Math.max(0, Math.min(newPerDay - log.newSeen, list.filter((c) => !S[c.id]).length));
  $("qDone").textContent = log.done;
  $("qMaster").textContent = CARDS.filter((c) => S[c.id] && S[c.id].ivl >= 21).length + "/" + CARDS.length;
  $("bars").innerHTML = SECS.map((s) => {
    const cs = CARDS.filter((c) => c.sec === s), n = cs.length;
    const m = cs.filter((c) => S[c.id] && S[c.id].ivl >= 21).length, l = cs.filter((c) => S[c.id] && S[c.id].ivl < 21).length;
    return `<div class="bar"><span class="nm" title="${esc(s)}">${esc(s)}</span><div class="track"><i class="m" style="width:${m / n * 100}%"></i><i class="l" style="width:${l / n * 100}%"></i></div><span class="v">${m}/${n}</span></div>`;
  }).join("");
}
function setMode(m) {
  mode = m; document.querySelectorAll("[data-mode]").forEach((b) => b.setAttribute("aria-pressed", b.dataset.mode === m));
  buildQueue(); next();
}
$("secSel").innerHTML = `<option value="">分野：すべて（${CARDS.length}枚）</option>` + SECS.map((s) => `<option value="${esc(s)}">${esc(s)}（${CARDS.filter((c) => c.sec === s).length}）</option>`).join("");
$("secSel").addEventListener("change", (e) => { sec = e.target.value; buildQueue(); next(); });
$("lvSel").addEventListener("change", (e) => { lvMin = +e.target.value; buildQueue(); next(); });
$("typeChk").checked = typing;
$("typeChk").addEventListener("change", (e) => { typing = e.target.checked; store.set("typing", typing); render(); });
$("newSel").value = String(newPerDay);
$("newSel").addEventListener("change", (e) => { newPerDay = +e.target.value; store.set("newPerDay", newPerDay); if (mode === "srs") { buildQueue(); next(); } else renderQueue(); });
document.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => setMode(b.dataset.mode)));
let armed = false;
$("resetBtn").addEventListener("click", () => {
  if (!armed) { armed = true; $("resetBtn").textContent = "本当にリセットする"; $("resetMsg").textContent = "もう一度押すと全カードの記録が消える。"; return; }
  S = {}; log = { day: today(), done: 0, newSeen: 0 }; store.set("state", S); store.set("log", log);
  armed = false; $("resetBtn").textContent = "記録をリセット"; $("resetMsg").textContent = "リセットした。"; setMode(mode);
});
setMode("srs");
</script>
